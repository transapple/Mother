<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parent Hub</title>
<style>
:root{--bg:#f6f7f3;--card:#fff;--ink:#14283c;--mut:#5d6b78;--line:#dfe4e0;--acc:#1f7a6d;--acc2:#e8a317;--bad:#c8553d;--ok:#2e8b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1a24;--card:#17252f;--ink:#e8eef2;--mut:#93a3b0;--line:#27394a;--acc:#4cb8a8;--acc2:#f0b43a;--bad:#e8806a;--ok:#5fc08a}}
:root[data-theme=dark]{--bg:#0f1a24;--card:#17252f;--ink:#e8eef2;--mut:#93a3b0;--line:#27394a;--acc:#4cb8a8;--acc2:#f0b43a;--bad:#e8806a;--ok:#5fc08a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 .4em;line-height:1.2}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.app{max-width:1000px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-family:Georgia,serif;font-size:20px;font-weight:700}.brand b{color:var(--acc)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;border:0;background:none;padding:10px 2px;font-size:12px;color:var(--mut);border-top:3px solid transparent}
nav.tabs button.on{color:var(--acc);border-top-color:var(--acc);font-weight:700}
nav.tabs span{display:block;height:24px;margin-bottom:2px}nav.tabs span svg{display:block;margin:0 auto}
@media(min-width:760px){nav.tabs{position:static;border:1px solid var(--line);border-radius:12px;margin-bottom:16px}nav.tabs button{font-size:14px;padding:12px}nav.tabs span{display:inline-block;height:auto;margin:0 8px 0 0;vertical-align:middle}nav.tabs span svg{width:20px;height:20px}.app{padding-bottom:40px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}.big{font-size:28px;font-family:Georgia,serif;font-weight:700}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600}
.btn.alt{background:none;color:var(--acc);border:1px solid var(--acc)}.btn.sm{padding:5px 10px;font-size:13px}.btn.bad{background:var(--bad)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}.pill.cur{color:var(--acc);border-color:var(--acc)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--acc)}
.chart{display:flex;gap:14px;align-items:flex-end;height:120px;margin:10px 0}.chart div{flex:1;text-align:center;font-size:12px}
.chart i{display:block;background:var(--acc);border-radius:6px 6px 0 0;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:13px}
.wrap{overflow-x:auto}
.tl{border-left:3px solid var(--line);margin-left:8px;padding-left:16px}.tl .card{position:relative}.tl .card:before{content:"";position:absolute;left:-26px;top:18px;width:13px;height:13px;border-radius:50%;background:var(--line);border:3px solid var(--bg)}.tl .card.now:before{background:var(--acc)}
.chat{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 0}
.msg{max-width:80%;padding:8px 11px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}.msg.me{align-self:flex-end;background:var(--acc);color:#fff;border-color:var(--acc)}
.msg small{display:block;opacity:.7;font-size:11px}
.ov{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.ov .card{max-width:420px;width:100%;margin:0}
.hint{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--mut);margin-bottom:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:30;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px}.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
@media print{body *{visibility:hidden}.printable,.printable *{visibility:visible}.printable{position:absolute;left:0;top:0;width:100%;border:0!important;background:#fff!important;color:#000!important}}
</style></head><body>
<div class="app" id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n).toLocaleString();
const SCHOOLS={'SCH-1001':{n:'Greenfield Academy',c:'Lagos',a:'14 Palm Avenue, Ikeja, Lagos',ph:'0803 555 0101',em:'office@greenfield.example',pr:'Mrs. Adaeze Nwosu',ss:'2026/2027'},'SCH-2002':{n:'Hillcrest College',c:'Abuja',a:'5 Unity Road, Garki, Abuja',ph:'0803 555 0202',em:'info@hillcrest.example',pr:'Mr. Tunde Bakare',ss:'2026/2027'},'SCH-3003':{n:'Sunrise Primary School',c:'Ibadan',a:'22 Market Street, Bodija, Ibadan',ph:'0803 555 0303',em:'hello@sunrise.example',pr:'Mrs. Funke Adeyemi',ss:'2026/2027'}};
// Demo child directory: the school registers children with their parent ID
const KIDS={'CH-001':{n:'Amara Okafor',g:'Grade 5',s:'SCH-1001',prev:null,p:'08031234567',dob:'12 March 2016',sex:'Female',adm:'GFA/2023/0412',addr:'7 Lake View Close, Lekki, Lagos',ct:'Mr. Sola Ibrahim',em:'Chidi Okafor, 0803 123 4567'},'CH-002':{n:'Daniel Okafor',g:'Grade 8',s:'SCH-2002',prev:'SCH-3003',p:'08031234567',dob:'3 August 2013',sex:'Male',adm:'HCC/2026/0178',addr:'7 Lake View Close, Lekki, Lagos',ct:'Mrs. Ngozi Eze',em:'Chidi Okafor, 0803 123 4567'},'CH-003':{n:'Zara Bello',g:'Grade 3',s:'SCH-3003',prev:null,p:'08099887766',dob:'21 January 2018',sex:'Female',adm:'SPS/2024/0093',addr:'18 Ring Road, Ibadan',ct:'Miss Kemi Ajayi',em:'Hauwa Bello, 0809 988 7766'}};
const nName=x=>x.toLowerCase().replace(/[^a-z ]/g,' ').split(/\s+/).filter(Boolean).sort().join(' ');
const nPhone=x=>String(x).replace(/\D/g,'').slice(-10);
const SUBJ=['Mathematics','English','Science','Social Studies'];
let S=null,tab='home',sel=null,thread=null,hf='all';
try{S=JSON.parse(localStorage.getItem('parenthub'))}catch(e){}
const save=()=>{try{localStorage.setItem('parenthub',JSON.stringify(S))}catch(e){}};
const fresh=()=>({parent:{name:'',contact:'',id:'',reg:0},schools:[],kids:[],msgs:{},ann:[],reqs:[]});
if(!S||!S.parent)S=fresh();S.reqs=S.reqs||[];S.links=S.links||[];
function seed(str){let h=7;for(const c of str)h=(h*31+c.charCodeAt(0))%9973;return i=>45+((h*(i+3)*17)%50)}
function record(childId,sid,from,to){const r=seed(childId+sid);const res=['Term 1','Term 2','Term 3'].map((t,i)=>({t,sub:SUBJ.map((s,j)=>({s,m:Math.min(98,r(i*4+j))}))}));
 const total=1200,paid=to?total*3:Math.round(total*(.5+(r(1)%3)/10)/50)*50;
 const pays=[{d:from,a:to?1200:Math.round(paid/2),ref:'RCP-'+r(2)+r(3)},{d:to||'2026-09',a:to?2400:paid-Math.round(paid/2),ref:'RCP-'+r(4)+r(5)}];
 return{sid,from,to,res,att:Math.min(99,r(6)+3),billed:to?total*3:total,paid:to?total*3:paid,pays,note:to?'Left to join another school. Good standing, no outstanding fees.':'Currently enrolled.'}}
const avg=rec=>{const l=rec.res[rec.res.length-1].sub;return Math.round(l.reduce((a,x)=>a+x.m,0)/l.length)};
const sch=id=>SCHOOLS[id]?SCHOOLS[id].n:id;
const bal=r=>r.billed-r.paid;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function modal(h){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="card">'+h+'</div>';o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o);return o}
function post(sid,from,text){(S.msgs[sid]=S.msgs[sid]||[]).push({from,text,t:new Date().toLocaleString([], {dateStyle:'short',timeStyle:'short'})})}
function sendWelcome(sid,child){post(sid,'school','Welcome to '+sch(sid)+'. '+child+' is now linked to your account. Please check the fee schedule on the Fees tab.')}

/* ---------- shell ---------- */
const IC={home:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h4.5v-6h4v6h4.5V10"/></svg>`,kids:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M17 14.2c2.4.2 4 2.2 4 5.3"/></svg>`,schools:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V9.5l7-5.5 7 5.5V21"/><path d="M9.5 21v-5h5v5"/><circle cx="12" cy="10.5" r="1.4"/></svg>`,fees:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>`,msgs:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11.5h7"/><path d="M8.5 14.5h4"/></svg>`,hist:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v4.5H8"/><path d="M12 7.5V12l3 2"/></svg>`,more:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>`,set:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="8" cy="17" r="2"/></svg>`};
const TABS=[['home',IC.home,'Home'],['kids',IC.kids,'Children'],['fees',IC.fees,'Fees'],['msgs',IC.msgs,'Messages'],['more',IC.more,'More']];
const MORE=['more','schools','hist'];
function render(){
 $('#app').innerHTML=`<header class="top"><div class="brand">Parent<b>Hub</b></div><div class="row" style="gap:6px"><span class="pill">${esc(S.parent.id)}</span><img src="${S.parent.photo||''}" alt="" style="width:34px;height:34px;border-radius:50%;object-fit:cover"><button class="btn alt sm" id="st">Profile</button></div></header>
 <nav class="tabs">${TABS.map(t=>`<button class="${(t[0]=='more'?(MORE.includes(tab)||tab.startsWith('f:')):tab==t[0])?'on':''}" data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav><main id="v"></main>`;
 document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;sel=null;render()});
 $('#st').onclick=settings;
 (tab.startsWith('f:')?feat:({home,kids,schools,fees,msgs,hist,more})[tab])();window.scrollTo(0,0)}

/* ---------- home ---------- */
function home(){const v=$('#v');const due=S.kids.reduce((a,k)=>a+Math.max(0,bal(k.cur)),0);
 let h=`<h1>Hello, ${esc(S.parent.name.split(' ')[0])}</h1><p class="mut">${S.kids.length} child${S.kids.length==1?'':'ren'} · ${S.schools.length} school${S.schools.length==1?'':'s'} linked</p>`;
 if(!S.schools.length)h+=`<div class="card empty"><h3>Start by linking a school</h3><p>Add your school's ID to connect with the school.</p><button class="btn" onclick="tab='schools';render()">Link a school</button></div>`;
 else if(!S.kids.length)h+=`<div class="card empty"><h3>Now link your children</h3><p>Enter each child's ID, full name and the phone number registered in the digital student app. You can link one or more children.</p><button class="btn" onclick="tab='kids';render()">Link children</button></div>`;
 else{h+=`<div class="card row"><div><div class="mut">Total fees due</div><div class="big" style="color:${due?'var(--bad)':'var(--ok)'}">${money(due)}</div></div><button class="btn" onclick="tab='fees';render()">Go to fees</button></div><div class="grid">`+
 S.kids.map(k=>`<div class="card"><div class="row"><h3>${esc(k.n)}</h3><span class="pill cur">${esc(k.g)}</span></div><div class="mut">${esc(sch(k.cur.sid))}</div>
 <div class="row" style="margin:10px 0 4px"><span>Average</span><b>${avg(k.cur)}%</b></div><div class="bar"><i style="width:${avg(k.cur)}%"></i></div>
 <div class="row" style="margin:10px 0 4px"><span>Attendance</span><b>${k.cur.att}%</b></div><div class="bar"><i style="width:${k.cur.att}%;background:var(--acc2)"></i></div>
 <p class="mut">Balance: <b style="color:${bal(k.cur)>0?'var(--bad)':'var(--ok)'}">${money(bal(k.cur))}</b></p><button class="btn alt sm" onclick="sel='${k.id}';tab='kids';render()">Open profile</button></div>`).join('')+'</div>';}
 if(S.kids.length)h+='<h2 style="margin-top:18px">Children\'s fees</h2><div class="card">'+S.kids.map((k,i)=>{const r=k.cur,b=bal(r),lp=r.pays.length?r.pays[r.pays.length-1]:null;return `<div style="${i?'border-top:1px solid var(--line);padding-top:12px;margin-top:12px':''}"><div class="row" style="flex-wrap:nowrap"><div style="min-width:0"><b>${esc(k.n)}</b><div class="mut" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sch(r.sid))}</div></div><span class="pill ${b>0?'bad':'ok'}" style="flex:none">${b>0?'Owing '+money(b):'Paid in full'}</span></div><div class="bar" style="margin:8px 0 4px"><i style="width:${Math.min(100,r.paid/r.billed*100)}%"></i></div><div class="row"><span class="mut">Paid ${money(r.paid)} of ${money(r.billed)}${lp?' · last '+esc(lp.d):''}</span>${b>0?`<button class="btn sm" onclick="pay('${k.id}')">Pay now</button>`:''}</div></div>`}).join('')+'<div style="margin-top:12px"><button class="btn alt sm" onclick="tab=\'fees\';render()">All fees and receipts</button></div></div>';
 if(S.schools.length){const mt=S.schools.map(id=>({id,m:(S.msgs[id]||[]).slice(-1)[0]})).filter(x=>x.m);h+='<h2 style="margin-top:18px">Recent messages</h2>'+(mt.length?mt.map(x=>`<button class="card" style="display:flex;width:100%;align-items:center;gap:10px;text-align:left" onclick="thread='${x.id}';tab='msgs';render()"><span style="flex:1;min-width:0"><b>${esc(sch(x.id))}</b> <span class="mut">${esc(x.m.t)}</span><span class="mut" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.m.from=='me'?'You: ':''}${esc(x.m.text)}</span></span><span class="mut" style="flex:none;font-size:22px;line-height:1">&rsaquo;</span></button>`).join(''):'<div class="card empty">No messages yet. Open Messages to write to a school.</div>')}
 const al=[];S.kids.forEach(k=>{const b=bal(k.cur);if(b>0)al.push({bad:1,t:'Fee reminder: '+k.n,b:money(b)+' outstanding at '+sch(k.cur.sid)+'.',tab:'fees'});al.push({t:'Results posted: '+k.n,b:'Latest term average is '+avg(k.cur)+'%.',tab:'kids',k:k.id})});
 if(al.length)h+='<h2 style="margin-top:18px">Alerts</h2>'+al.map(a=>`<div class="card row" style="border-left:4px solid ${a.bad?'var(--bad)':'var(--acc)'}"><div><b>${esc(a.t)}</b> <span class="pill">Required</span><div class="mut">${esc(a.b)}</div></div><button class="btn alt sm" onclick="${a.k?`sel='${a.k}';`:''}tab='${a.tab}';render()">View</button></div>`).join('');
 const ev=S.ann;h+=`<h2 style="margin-top:18px">Notices from schools</h2>`+(ev.length?ev.slice().reverse().map(a=>`<div class="card"><b>${esc(a.t)}</b><div class="mut">${esc(a.s)} · ${esc(a.d)}</div><p style="margin:6px 0 0">${esc(a.b)}</p></div>`).join(''):'<div class="card empty">No notices yet. Schools you link will post here.</div>');
 v.innerHTML=h}

/* ---------- schools ---------- */
function schools(){const v=$('#v');
 v.innerHTML=`<h1>Schools</h1><div class="card"><h3>Link a school</h3><div class="hint">Demo school IDs: SCH-1001, SCH-2002, SCH-3003</div><label>School ID</label><input id="sid" placeholder="SCH-1001"><button class="btn" id="ls">Link school</button></div>
 `+(S.schools.length?S.schools.map(id=>{const n=S.kids.filter(k=>k.cur.sid==id);return `<div class="card row"><div><h3>${esc(sch(id))}</h3><div class="mut">${esc(id)} · ${esc(SCHOOLS[id]?SCHOOLS[id].c:'')} · ${n.length} current child${n.length==1?'':'ren'}</div></div><div class="row"><button class="btn alt sm" onclick="thread='${id}';tab='msgs';render()">Message</button><button class="btn alt sm" style="color:var(--bad);border-color:var(--bad)" onclick="unlink('${id}')">Unlink</button></div></div>`}).join(''):'<div class="card empty">No schools linked yet.</div>');
 $('#ls').onclick=()=>{const id=$('#sid').value.trim().toUpperCase();if(!SCHOOLS[id])return toast('School ID not found');if(S.schools.includes(id))return toast('Already linked');
  S.schools.push(id);S.ann.push({t:'Welcome to '+SCHOOLS[id].n,s:SCHOOLS[id].n,d:new Date().toLocaleDateString(),b:'Next term begins soon. Fees are due within the first two weeks. Contact the bursar with any question.'});save();toast('School linked');render()}}
function unlink(id){if(S.kids.some(k=>k.cur.sid==id))return toast('Move or unlink the children first');S.schools=S.schools.filter(x=>x!=id);save();render()}

/* ---------- children ---------- */
function kids(){const v=$('#v');if(sel){const k=S.kids.find(x=>x.id==sel);if(k)return kid(k)}
 v.innerHTML=`<h1>Children</h1><div class="card"><h3>Link a child</h3><div class="hint">Demo: CH-001 Amara Okafor, CH-002 Daniel Okafor (phone 0803 123 4567), CH-003 Zara Bello (phone 0809 988 7766). Link the child's school first.</div><label>Child ID</label><input id="cid" placeholder="CH-001" autocapitalize="characters"><label>Child's full name</label><input id="cn" placeholder="As registered at school" autocomplete="off"><label>Your phone number (as registered in the digital student app)</label><input id="cp" type="tel" inputmode="tel" value="${esc(S.parent.phone||'')}" placeholder="08012345678"><button class="btn" id="lc">Verify and link child</button></div>
 <div class="grid">`+(S.kids.length?S.kids.map(k=>`<div class="card"><div class="row"><h3>${esc(k.n)}</h3><span class="pill">${esc(k.id)}</span></div><div class="mut">${esc(k.g)} · ${esc(sch(k.cur.sid))}</div><p>Average <b>${avg(k.cur)}%</b> · ${k.hist.length} former school${k.hist.length==1?'':'s'}</p><button class="btn sm" onclick="sel='${k.id}';render()">View profile</button></div>`).join(''):'<div class="card empty">No children linked yet.</div>')+'</div>';
 $('#lc').onclick=()=>{const id=$('#cid').value.trim().toUpperCase(),d=KIDS[id];if(!d)return toast('Child ID not found');if(S.kids.some(k=>k.id==id))return toast('Already linked');
  if(!S.schools.includes(d.s))return toast('Link '+sch(d.s)+' first');
  if(!$('#cn').value.trim())return toast("Enter the child's full name");if(nName($('#cn').value)!=nName(d.n))return toast("The name does not match this child ID");
  const ph=$('#cp').value.trim();if(nPhone(ph).length<10)return toast('Enter your registered phone number');if(nPhone(ph)!=nPhone(d.p))return toast('This phone number is not registered for this child');S.parent.phone=ph;

 $('#mb').onclick=()=>{if(ms.some(m=>m.s==$('#ms').value&&m.w==$('#mw').value))return toast('Already booked');ms.push({w:$('#mw').value,s:$('#ms').value,r:$('#mr').value.trim()||'General discussion'});save();toast('Meeting requested');fMeet(k,el)};
 el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ms.splice(+b.dataset.i,1);save();fMeet(k,el)})}
function fSlip(k,el){const st=X(k,'slips',{}),L=[['Zoo field trip','Trip to the National Zoo. Cost $15 for transport and entry. Departs 8:00 am.',10],['Sports day participation','Permission to take part in athletics events on sports day.',14],['Photo and media consent','Allow the school to use photos in newsletters and on its website.',20]];
 el.innerHTML=L.map((s,i)=>{const v=st[i];return `<div class="card"><div class="row"><b>${s[0]}</b><span class="pill ${v?(v.v=='approved'?'ok':'bad'):''}">${v?(v.v=='approved'?'Approved':'Declined'):'Waiting for you'}</span></div><p class="mut">${s[1]}<br>Reply by ${fd(D(s[2]))}</p>${v?`<span class="mut">Decided ${esc(v.d)}</span> <button class="btn alt sm" data-c="${i}">Change</button>`:`<div class="row" style="justify-content:flex-start"><button class="btn sm" data-i="${i}" data-v="approved">Approve</button><button class="btn alt sm" data-i="${i}" data-v="declined">Decline</button></div>`}</div>`}).join('');
 el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{st[+b.dataset.i]={v:b.dataset.v,d:new Date().toLocaleDateString()};save();fSlip(k,el)});el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{delete st[+b.dataset.c];save();fSlip(k,el)})}
function fPick(k,el){const L=X(k,'pick',[{n:S.parent.name,rel:'Parent',ph:S.parent.phone||'',c:String(1000+R(k,'c')(1)*53%9000)}]);
 el.innerHTML=`<div class="hint">Staff check the name and code at the gate before your child leaves with anyone.</div>${L.map((p,i)=>`<div class="card row"><div><b>${esc(p.n)}</b><div class="mut">${esc(p.rel)}${p.ph?' · '+esc(p.ph):''}</div></div><div class="row" style="gap:8px"><span class="pill cur" style="font-size:15px;letter-spacing:2px">${p.c}</span>${i?`<button class="btn alt sm" data-i="${i}">Remove</button>`:''}</div></div>`).join('')}<div class="card"><h3>Authorize another person</h3><label>Full name</label><input id="pn"><label>Relationship</label><input id="pl" placeholder="Uncle, driver, neighbor..."><label>Phone number</label><input id="pp" type="tel"><button class="btn" id="pa">Authorize and create code</button></div>`;
 $('#pa').onclick=()=>{const n=$('#pn').value.trim();if(!n)return toast('Enter the full name');L.push({n,rel:$('#pl').value.trim()||'Other',ph:$('#pp').value.trim(),c:String(1000+Math.floor(Math.random()*9000))});save();toast('Person authorized');fPick(k,el)};

function fBus(k,el){const rr=R(k,'b'),h=new Date().getHours()+new Date().getMinutes()/60,S1=['Home stop','Palm Junction','Market Square','Central Roundabout','School gate'],T=['6:50','7:05','7:20','7:35','7:50'],cur=h<6.8?-1:h<7.9?Math.min(4,Math.floor((h-6.8)/.25)):9;
 const sat=cur==-1?'Bus has not started its route':cur<4?'On the way to school, near '+S1[cur]:cur==4?'Arrived at school':h<15?'At school':h<17?'Afternoon drop-off in progress':'Trip complete';

function fHealth(k,el){const H=X(k,'health',{bg:'',gt:'',al:'',cond:'',med:'',dr:'',dp:'',note:''}),F=[['bg','Blood group'],['gt','Genotype'],['al','Allergies'],['cond','Medical conditions'],['med','Medication'],['dr','Family doctor'],['dp','Doctor phone'],['note','Notes for the school nurse']];

function fBeh(k,el){const rr=R(k,'b'),I=KIDS[k.id]||{},M=['Helped a classmate','Top score in a quiz','Excellent homework streak','Led a group project'],B=['Late to class','Talking during a lesson','Homework not done'],L=[0,1,2,3,4,5].map(i=>{const m=rr(i)%4!=0;return{m,t:m?M[rr(i+3)%4]:B[rr(i+3)%3],p:m?5:-3,d:D(-3-i*4),by:I.ct||'Class teacher'}}),sc=80+L.reduce((a,x)=>a+x.p,0);
 el.innerHTML=`<div class="card row"><div><div class="mut">Behavior score</div><div class="big">${sc}</div></div><span class="pill ${sc>=80?'ok':'bad'}">${sc>=80?'Good standing':'Needs support'}</span></div>`+L.map(x=>`<div class="card row" style="border-left:4px solid ${x.m?'var(--ok)':'var(--bad)'}"><div><b>${x.t}</b><div class="mut">${fd(x.d)} · ${esc(x.by)}</div></div><span class="pill ${x.m?'ok':'bad'}">${x.p>0?'+':''}${x.p}</span></div>`).join('')}
function fGuard(k,el){S.guard=S.guard||[{n:S.parent.name,rel:'Primary guardian',perm:'Full access',me:1,st:'Active'}];const P=['View only','View and pay fees','Full access'];
 el.innerHTML=`<div class="card">${S.guard.map((g,i)=>`<div class="row" style="padding:8px 0;${i?'border-top:1px solid var(--line)':''}"><span><b>${esc(g.n)}</b>${g.me?' (you)':''}<br><span class="mut">${esc(g.rel)}${g.ph?' · '+esc(g.ph):''} · ${esc(g.st)}</span></span>${g.me?`<span class="pill">${g.perm}</span>`:`<span class="row" style="gap:6px"><select data-p="${i}" style="width:auto;margin:0">${P.map(o=>`<option ${o==g.perm?'selected':''}>${o}</option>`).join('')}</select><button class="btn alt sm" data-r="${i}">Remove</button></span>`}</div>`).join('')}</div><div class="card"><h3>Invite a guardian</h3><p class="mut">Each guardian gets their own login once sign-in is connected.</p><label>Full name</label><input id="gn"><label>Phone number</label><input id="gp" type="tel"><label>Relationship</label><input id="gr" placeholder="Spouse, aunt, uncle..."><label>Access</label><select id="ga">${P.map(o=>`<option>${o}</option>`).join('')}</select><button class="btn" id="gi">Send invitation</button></div>`;

 el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.guard.splice(+b.dataset.r,1);save();fGuard(k,el)});el.querySelectorAll('[data-p]').forEach(s=>s.onchange=()=>{S.guard[+s.dataset.p].perm=s.value;save();toast('Access updated')})}
(async()=>{if(tok()){try{await loadMe();render();return}catch(e){localStorage.removeItem('ph_tok')}}localStorage.getItem('ph_acct')?loginScreen():regScreen()})();

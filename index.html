<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parent Hub</title>
<style>
:root{--bg:#f6f7f3;--card:#fff;--ink:#14283c;--mut:#5d6b78;--line:#dfe4e0;--acc:#1f7a6d;--acc2:#e8a317;--bad:#c8553d;--ok:#2e8b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1a24;--card:#17252f;--ink:#e8eef2;--mut:#93a3b0;--line:#27394a;--acc:#4cb8a8;--acc2:#f0b43a;--bad:#e8806a;--ok:#5fc08a}}
:root[data-theme=dark]{--bg:#0f1a24;--card:#17252f;--ink:#e8eef2;--mut:#93a3b0;--line:#27394a;--acc:#4cb8a8;--acc2:#f0b43a;--bad:#e8806a;--ok:#5fc08a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 .4em;line-height:1.2}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.app{max-width:1000px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-family:Georgia,serif;font-size:20px;font-weight:700}.brand b{color:var(--acc)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;border:0;background:none;padding:10px 2px;font-size:12px;color:var(--mut);border-top:3px solid transparent}
nav.tabs button.on{color:var(--acc);border-top-color:var(--acc);font-weight:700}
nav.tabs span{display:block;height:24px;margin-bottom:2px}nav.tabs span svg{display:block;margin:0 auto}
@media(min-width:760px){nav.tabs{position:static;border:1px solid var(--line);border-radius:12px;margin-bottom:16px}nav.tabs button{font-size:14px;padding:12px}nav.tabs span{display:inline-block;height:auto;margin:0 8px 0 0;vertical-align:middle}nav.tabs span svg{width:20px;height:20px}.app{padding-bottom:40px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}.big{font-size:28px;font-family:Georgia,serif;font-weight:700}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600}
.btn.alt{background:none;color:var(--acc);border:1px solid var(--acc)}.btn.sm{padding:5px 10px;font-size:13px}.btn.bad{background:var(--bad)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}.pill.cur{color:var(--acc);border-color:var(--acc)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--acc)}
.chart{display:flex;gap:14px;align-items:flex-end;height:120px;margin:10px 0}.chart div{flex:1;text-align:center;font-size:12px}
.chart i{display:block;background:var(--acc);border-radius:6px 6px 0 0;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:13px}
.wrap{overflow-x:auto}
.tl{border-left:3px solid var(--line);margin-left:8px;padding-left:16px}.tl .card{position:relative}.tl .card:before{content:"";position:absolute;left:-26px;top:18px;width:13px;height:13px;border-radius:50%;background:var(--line);border:3px solid var(--bg)}.tl .card.now:before{background:var(--acc)}
.chat{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 0}
.msg{max-width:80%;padding:8px 11px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}.msg.me{align-self:flex-end;background:var(--acc);color:#fff;border-color:var(--acc)}
.msg small{display:block;opacity:.7;font-size:11px}
.ov{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.ov .card{max-width:420px;width:100%;margin:0}
.hint{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--mut);margin-bottom:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:30;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px}.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
@media print{body *{visibility:hidden}.printable,.printable *{visibility:visible}.printable{position:absolute;left:0;top:0;width:100%;border:0!important;background:#fff!important;color:#000!important}}
</style></head><body>
<div class="app" id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nName=x=>x.toLowerCase().replace(/[^a-z ]/g,' ').split(/\s+/).filter(Boolean).sort().join(' ');
const nPhone=x=>String(x).replace(/\D/g,'').slice(-10);

const money=(n,c)=>(c||'UGX')+' '+Number(n||0).toLocaleString();
const fd=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
let S=null,tab='home',sel=null;
try{S=JSON.parse(localStorage.getItem('parenthub'))}catch(e){}
const save=()=>{try{localStorage.setItem('parenthub',JSON.stringify({parent:S.parent,reqs:S.reqs,links:S.links}))}catch(e){}};
if(!S||!S.parent)S={parent:{name:'',contact:'',id:'',reg:0},reqs:[],links:[]};S.reqs=S.reqs||[];S.links=S.links||[];
const MSB='https://huczdzvnzgwunktxcdcj.supabase.co',MSK='sb_publishable_vNIJnOIgT2BefVZSFa4dEw_S12A4xzo';
async function msRpc(fn,a){let r;try{r=await fetch(MSB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:MSK,Authorization:'Bearer '+MSK,'Content-Type':'application/json'},body:JSON.stringify(a)})}catch(e){throw new Error('No connection. Check your internet and try again.')}if(!r.ok)throw new Error('Could not check with the school system. Try again.');return r.json()}
const REC={},ERR={};let loading=false;
async function getRec(c){if(!c.school_code||!c.phone||!c.child_name)return null;return msRpc('parent_hub_record',{p_code:c.school_code,p_sin:c.student_id,p_name:c.child_name,p_phone:c.phone})}
async function loadAll(){if(!S.links.length){render();return}loading=true;render();
 await Promise.all(S.links.map(async c=>{try{const r=await getRec(c);if(r){REC[c.student_id]=r;delete ERR[c.student_id]}else ERR[c.student_id]=c.school_code&&c.phone?'The school could not confirm this child. Ask the school to check the student ID, name and your phone number.':'This child needs to be verified again. Tap Verify.'}catch(e){ERR[c.student_id]=e.message}}));
 loading=false;render()}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function modal(h){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="card">'+h+'</div>';o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o);return o}
const IC={home:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h4.5v-6h4v6h4.5V10"/></svg>`,kids:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M17 14.2c2.4.2 4 2.2 4 5.3"/></svg>`,schools:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V9.5l7-5.5 7 5.5V21"/><path d="M9.5 21v-5h5v5"/><circle cx="12" cy="10.5" r="1.4"/></svg>`,fees:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>`,msgs:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11.5h7"/><path d="M8.5 14.5h4"/></svg>`,hist:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v4.5H8"/><path d="M12 7.5V12l3 2"/></svg>`,more:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>`,set:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="8" cy="17" r="2"/></svg>`};
const TABS=[['home',IC.home,'Home'],['kids',IC.kids,'Children'],['fees',IC.fees,'Fees'],['msgs','✉','Messages'],['more',IC.more,'Account']];
function render(){
 $('#app').innerHTML=`<header class="top"><div class="brand">Parent<b>Hub</b></div><div class="row" style="gap:6px"><span class="pill">${esc(S.parent.id)}</span><img src="${S.parent.photo||''}" alt="" style="width:34px;height:34px;border-radius:50%;object-fit:cover"><button class="btn alt sm" id="st">Profile</button></div></header>
 <nav class="tabs">${TABS.map(t=>`<button class="${tab==t[0]?'on':''}" data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav><main id="v"></main>`;
 document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;sel=null;render()});
 $('#st').onclick=settings;
 ({home,kids,fees,msgs,more})[tab]();window.scrollTo(0,0)}
const latest=r=>r&&r.terms&&r.terms.length?r.terms[r.terms.length-1]:null;
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p||0))}%${c?';background:'+c:''}"></i></div>`;
const wait=c=>loading&&!REC[c.student_id]&&!ERR[c.student_id];
const kv=rows=>'<table>'+rows.filter(x=>x[1]).map(x=>`<tr><th style="width:42%">${esc(x[0])}</th><td>${esc(x[1])}</td></tr>`).join('')+'</table>';
function dueTotals(){const t={};S.links.forEach(c=>{const f=(REC[c.student_id]||{}).fees;if(f){const k=f.currency||'UGX';t[k]=(t[k]||0)+Math.max(0,Number(f.balance)||0)}});return t}


/* ---------- messages (private chats with the school) ---------- */
const DEPT={class_teacher:'Class teacher',head_teacher:'Head teacher',dos:'Director of Studies',bursar:'Bursar',office:'School office'};
let mt=null,mpoll=null,MT=[];
const bub=m=>`<div style="display:flex;justify-content:${m.side=='parent'?'flex-end':'flex-start'};margin:6px 0"><div style="max-width:82%;padding:8px 11px;border-radius:12px;background:${m.side=='parent'?'var(--acc,#2a6)':'#eef0f2'};color:${m.side=='parent'?'#fff':'#222'}"><div style="font-size:11px;opacity:.75">${esc(m.sender||'')} · ${esc(fd(m.at))} ${esc(String(m.at||'').slice(11,16))}</div>${esc(m.body)}</div></div>`;
async function msgs(){const v=$('#v');clearInterval(mpoll);if(mt)return thread();
 v.innerHTML='<h1>Messages</h1><p class="mut">Private chats with your child\'s school. Only you and that department can read them.</p><div id="ml"><p class="mut">Loading...</p></div><p><button class="btn" id="nm">New message</button></p>';
 $('#nm').onclick=compose;
 const load=async()=>{try{MT=await rpc('parent_msg_threads',{t:tok()});const l=$('#ml');if(!l)return;l.innerHTML=MT.length?MT.map((x,i)=>`<div class="card" onclick="mt=MT[${i}];msgs()" style="cursor:pointer"><div class="row"><b>${esc(DEPT[x.dept]||x.dept)}</b>${x.unread>0?`<span class="pill cur">${x.unread} new</span>`:''}</div><div class="mut">${esc(x.child_name||x.student_id)}</div><div>${esc(x.last_body||'')}</div></div>`).join(''):'<div class="card empty"><p>No messages yet. Tap New message to write to the school.</p></div>'}catch(e){const l=$('#ml');if(l)l.innerHTML='<p class="mut">'+esc(e.message)+'</p>'}};
 load();mpoll=setInterval(()=>{if(tab=='msgs'&&!mt)load();else if(tab!='msgs')clearInterval(mpoll)},15000)}
function compose(){if(!S.links.length)return toast('Link your child first');
 const o=modal(`<h3>New message</h3><label>Child</label><select id="mc">${S.links.map(c=>`<option value="${esc(c.student_id)}">${esc(c.child_name||c.student_id)}</option>`).join('')}</select><label>Send to</label><select id="md">${Object.keys(DEPT).map(k=>`<option value="${k}">${DEPT[k]}</option>`).join('')}</select><label>Message</label><textarea id="mb" rows="4" maxlength="2000"></textarea><div class="row"><button class="btn alt" id="x">Cancel</button><button class="btn" id="ok">Send</button></div>`);
 o.querySelector('#x').onclick=()=>o.remove();
 o.querySelector('#ok').onclick=async()=>{const b=o.querySelector('#ok'),body=o.querySelector('#mb').value.trim();if(!body)return toast('Type a message');busy(b,1);try{await rpc('parent_msg_send',{t:tok(),p_sid:o.querySelector('#mc').value,p_dept:o.querySelector('#md').value,p_body:body});o.remove();toast('Sent');msgs()}catch(e){toast(e.message);busy(b,0)}}}
async function thread(){const v=$('#v');
 v.innerHTML=`<p><button class="btn alt sm" id="bk">Back</button></p><h2>${esc(DEPT[mt.dept]||mt.dept)}</h2><p class="mut">${esc(mt.child_name||mt.student_id)}</p><div id="bx"></div><div class="row" style="gap:6px;margin-top:10px"><textarea id="rb" rows="2" maxlength="2000" style="flex:1" placeholder="Write a reply"></textarea><button class="btn" id="sd">Send</button></div>`;
 $('#bk').onclick=()=>{mt=null;clearInterval(mpoll);msgs()};
 const load=async()=>{try{const L=await rpc('parent_msg_open',{t:tok(),p_thread:mt.id}),b=$('#bx');if(!b)return;const n=b.children.length;b.innerHTML=L.map(bub).join('');if(L.length!=n)window.scrollTo(0,document.body.scrollHeight)}catch(e){toast(e.message)}};
 await load();clearInterval(mpoll);mpoll=setInterval(()=>{if(tab=='msgs'&&mt)load();else clearInterval(mpoll)},8000);
 $('#sd').onclick=async()=>{const b=$('#sd'),t=$('#rb').value.trim();if(!t)return;busy(b,1);try{await rpc('parent_msg_send',{t:tok(),p_sid:mt.student_id,p_dept:mt.dept,p_body:t});$('#rb').value='';await load()}catch(e){toast(e.message)}busy(b,0)}}
/* ---------- home ---------- */
function home(){const v=$('#v');
 let h=`<h1>Hello, ${esc((S.parent.name||'').split(' ')[0])}</h1><p class="mut">${S.links.length} child${S.links.length==1?'':'ren'} linked</p>`;
 if(!S.links.length){v.innerHTML=h+`<div class="card empty"><h3>Link your child</h3><p>You need the school ID, your child's student ID and full name, and the phone number the school has for you.</p><button class="btn" onclick="tab='kids';render()">Link a child</button></div>`;return}
 const dt=dueTotals(),ks=Object.keys(dt);
 if(ks.length)h+=`<div class="card row"><div><div class="mut">Total fees due</div><div class="big" style="color:${ks.some(k=>dt[k])?'var(--bad)':'var(--ok)'}">${ks.map(k=>money(dt[k],k)).join(' + ')}</div></div><button class="btn" onclick="tab='fees';render()">Go to fees</button></div>`;
 h+='<div class="grid">'+S.links.map(c=>{const r=REC[c.student_id],t=latest(r),a=r&&r.attendance;
  return `<div class="card"><div class="row"><h3>${esc(c.child_name||c.student_id)}</h3>${r&&r.child&&r.child.class?`<span class="pill cur">${esc(r.child.class)}</span>`:''}</div><div class="mut">${esc(c.school_name||'')}</div>`+
  (r?`<div class="row" style="margin:10px 0 4px"><span>Average${t?' ('+esc(t.name)+')':''}</span><b>${t&&t.average!=null?Math.round(t.average)+'%':'Not entered'}</b></div>${t&&t.average!=null?bar(t.average):''}
  <div class="row" style="margin:10px 0 4px"><span>Attendance</span><b>${a&&a.percent!=null?Math.round(a.percent)+'%':'Not recorded'}</b></div>${a&&a.percent!=null?bar(a.percent,'var(--acc2)'):''}`
  :`<p class="mut">${wait(c)?'Loading from the school...':esc(ERR[c.student_id]||'')}</p>`)+
  `<p><button class="btn sm" onclick="tab='kids';sel='${c.student_id}';render()">View profile</button></p></div>`}).join('')+'</div>';
 const notes=[];S.links.forEach(c=>{const r=REC[c.student_id];(r&&r.notices||[]).forEach(n=>notes.push({...n,school:c.school_name}))});
 notes.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 if(notes.length)h+='<h2 style="margin-top:18px">School notices</h2>'+notes.slice(0,8).map(n=>`<div class="card"><div class="row"><b>${esc(n.title||'Notice')}</b><span class="mut">${esc(fd(n.date))}</span></div><div class="mut">${esc(n.school||'')}</div><p>${esc(n.body||'')}</p></div>`).join('');
 v.innerHTML=h}

/* ---------- children ---------- */
function kids(){const v=$('#v');
 if(sel){const c=S.links.find(x=>x.student_id==sel);if(c)return kid(c)}
 v.innerHTML=`<h1>Children</h1><div class="card"><h3>Link a child</h3><div class="hint">Use the school ID from the school, your child's 12-character student ID, the child's full name as the school registered it, and the phone number the school has for you.</div><label>School ID</label><input id="lsc" placeholder="School ID" autocapitalize="characters" autocomplete="off"><label>Student ID</label><input id="lcid" maxlength="12" placeholder="Student ID, 12 characters" autocapitalize="characters" autocomplete="off"><label>Child's full name</label><input id="lcn" placeholder="As registered at school" autocomplete="off"><label>Phone number the school has for you</label><input id="lcp" type="tel" inputmode="tel" value="${esc(S.parent.phone||'')}"><label>Your relationship to the child</label><select id="lcr"><option value="">Choose</option>${['Father','Mother','Guardian','Brother','Sister','Uncle','Auntie','Grandparent','Next of kin','Other'].map(x=>`<option${(localStorage.getItem('ph_rel')||((S.parent.id||'')[0]=='G'?'Guardian':''))==x?' selected':''}>${x}</option>`).join('')}</select><button class="btn" id="lcb">Verify and link</button></div><div class="grid">`+
 (S.links.length?S.links.map(c=>{const r=REC[c.student_id];return `<div class="card"><div class="row"><h3>${esc(c.child_name||c.student_id)}</h3><span class="pill">${esc(c.student_id)}</span></div><div class="mut">${esc((r&&r.child&&r.child.class)||'')}${r&&r.child&&r.child.class?' · ':''}${esc(c.school_name||'')}</div>${r?'':`<p class="mut">${wait(c)?'Loading from the school...':esc(ERR[c.student_id]||'')}</p>`}<button class="btn sm" data-v="${c.student_id}">${r?'View profile':'Open'}</button> ${!c.school_code||!c.phone?`<button class="btn alt sm" data-f="${c.student_id}">Verify</button>`:''}</div>`}).join(''):'<div class="card empty">No children linked yet.</div>')+'</div>';
 $('#lcb').onclick=linkChild;
 v.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{sel=b.dataset.v;render()});
 v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{$('#lcid').value=b.dataset.f;$('#lcid').scrollIntoView();$('#lsc').focus()})}
async function linkChild(){
 const sc=$('#lsc').value.trim().toUpperCase(),sid=$('#lcid').value.trim().toUpperCase(),nm=$('#lcn').value.trim(),ph=$('#lcp').value.trim(),rl=($('#lcr')||{}).value||'';
 if(!sc)return toast('Enter the school ID');
 if(!/^S[FM][0-9]{8}[A-Z]{2}$/.test(sid))return toast('Student ID is 12 characters, like SF15847954VI');
 if(nm.split(/\s+/).filter(Boolean).length<2)return toast("Enter the child's full name");
 if(nPhone(ph).length<9)return toast('Enter the phone number the school has for you');
 if(!rl)return toast('Choose your relationship to the child');

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TransApple</title>
<meta name="theme-color" content="#3457D5">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TransApple">
<style>
  :root{
    /* Ink & neutrals */
    --navy:#161A26; --navy-2:#2A2F42; --ink:#1A1D27; --ink-soft:#666C7D;
    --slate:#8A90A0; --slate-tint:#EEF0F5; --line:#E6E8EF; --line-soft:#EEF0F5;
    --bg:#F0F1F6; --card:#FFFFFF; --surface-2:#F6F7FB;
    /* Accent (primary actions, active nav) — cool azure, distinct from status colors */
    --accent:#3457D5; --accent-dark:#28439E; --accent-tint:#EAEFFD;
    /* Status semantics */
    --teal:#1C9A6C; --teal-dark:#157A56; --teal-tint:#E3F6EC;
    --red:#D8433B; --red-dark:#B33831; --red-tint:#FCEAE9;
    --amber:#B8790F; --amber-tint:#FCF1DC;
    --radius:16px; --radius-sm:12px; --radius-lg:20px;
    --shadow-sm:0 1px 2px rgba(20,23,35,.05), 0 1px 1px rgba(20,23,35,.03);
    --shadow-md:0 12px 28px -12px rgba(20,23,35,.20);
    --shadow-lg:0 20px 45px -18px rgba(20,23,35,.30);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{overflow-x:hidden;width:100%;max-width:100%;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:720px;margin:0 auto;padding:16px 14px calc(78px + env(safe-area-inset-bottom,0px));overflow-x:hidden;}
  img{max-width:100%;}

  /* ---- Top bar / brand / account chip ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;padding:2px 2px 0;}
  .brand{font-weight:800;font-size:19px;letter-spacing:-.01em;color:var(--navy);display:inline-flex;align-items:center;}
  .brand span{color:var(--accent);}
  .acct-chip{display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 13px 5px 5px;box-shadow:var(--shadow-sm);transition:border-color .15s ease,transform .1s ease;}
  .acct-chip:hover{border-color:var(--accent);}
  .acct-chip:active{transform:scale(.97);}
  .acct-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(155deg,var(--accent),var(--accent-dark));color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .acct-name{font-size:12.5px;font-weight:700;color:var(--navy-2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* =========================================================
     BOTTOM NAV — fixed 5-slot rail, no horizontal scrolling.
     Overflow items (Updates / Security / Settings) live behind
     the "More" slot as a slide-up sheet, the same pattern real
     native apps use once they have more than ~5 destinations.
     ========================================================= */
  .tabrail{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));margin:0;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);box-shadow:0 -8px 24px -14px rgba(20,23,35,.20);z-index:100;max-width:100%;overflow:hidden;}
  .tab-pill{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;color:var(--slate);font-size:10.5px;font-weight:700;padding:5px 1px 4px;border-radius:14px;cursor:pointer;transition:color .15s ease,transform .1s ease;position:relative;}
  .tab-pill:active{transform:scale(.94);}
  .tab-pill .icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:background .15s ease;margin-bottom:1px;}
  .tab-pill .icon svg{width:21px;height:21px;}
  .tab-pill.is-active{color:var(--accent-dark);}
  .tab-pill.is-active .icon{background:var(--accent-tint);}
  .tab-pill .nav-dot{position:absolute;top:4px;right:calc(50% - 15px);width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--card);}

  /* ---- "More" slide-up sheet (Updates / Security / Settings) ---- */
  .more-backdrop{position:fixed;inset:0;background:rgba(15,17,26,.42);z-index:130;opacity:0;pointer-events:none;transition:opacity .18s ease;}
  .more-backdrop.is-open{opacity:1;pointer-events:auto;}
  .more-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -20px 45px -10px rgba(20,23,35,.35);z-index:131;padding:10px 14px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s cubic-bezier(.32,.72,0,1);max-width:720px;margin:0 auto;}
  .more-sheet.is-open{transform:translateY(0);}
  .more-sheet-handle{width:36px;height:4px;border-radius:99px;background:var(--line);margin:2px auto 12px;}
  .more-sheet-title{font-weight:800;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;padding:0 4px 8px;}
  .more-item{display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:14px;cursor:pointer;transition:background .12s ease;}
  .more-item:active{background:var(--surface-2);}
  .more-item .icon{width:34px;height:34px;border-radius:10px;background:var(--slate-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--navy-2);}
  .more-item .icon svg{width:18px;height:18px;}
  .more-item-label{font-weight:700;font-size:14px;color:var(--navy);flex:1;}
  .more-item-chevron{color:var(--slate);font-size:18px;}

  /* =========================================================
     GROUPED MENU LIST — used for a school's own tabs (Oversight,
     Subscription, Features & Modules, Administrators, Danger
     Zone) and Settings (Account, Plans & Features, Admins), so
     both drill into one screen at a time via a native-style
     grouped list instead of a horizontal pill bar.
     ========================================================= */
  .menu-list-card{padding:6px 8px;}
  .menu-row{display:flex;align-items:center;gap:12px;padding:13px 8px;cursor:pointer;border-bottom:1px solid var(--line-soft);transition:background .12s ease;}
  .menu-row:last-child{border-bottom:none;}
  .menu-row:active{background:var(--surface-2);}
  .menu-row.is-danger .menu-row-label{color:var(--red-dark);}
  .menu-row-icon{width:34px;height:34px;border-radius:10px;background:var(--slate-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--navy-2);}
  .menu-row-icon svg{width:18px;height:18px;}
  .menu-row.is-danger .menu-row-icon{background:var(--red-tint);color:var(--red-dark);}
  .menu-row-label{font-weight:700;font-size:14px;color:var(--navy);flex:1;min-width:0;}
  .menu-row-chevron{color:var(--slate);font-size:18px;flex-shrink:0;}

  /* ---- Secondary nav (within a school / settings) ---- */
  .subtabrail{display:flex;gap:5px;overflow-x:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px;-ms-overflow-style:none;scrollbar-width:none;}
  .subtabrail::-webkit-scrollbar{display:none;}
  .subtab-pill{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;border:none;background:transparent;color:var(--ink-soft);font-size:12.5px;font-weight:700;padding:9px 12px;border-radius:11px;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
  .subtab-pill:hover{color:var(--navy);}
  .subtab-pill.is-active{background:var(--card);color:var(--accent-dark);box-shadow:var(--shadow-sm);}
  .subtab-pill.is-danger.is-active{color:var(--red-dark);}

  .icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0;}

  /* =========================================================
     CARDS — every panel of content sits inside one of these.
     ========================================================= */
  .card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
  .card-danger{border-color:#F0C7C3;background:linear-gradient(180deg,var(--red-tint),var(--card) 70px);}
  .section-title{font-weight:800;font-size:14.5px;margin-bottom:12px;letter-spacing:-.005em;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .section-title .count-chip{font-size:11px;font-weight:800;color:var(--ink-soft);background:var(--slate-tint);border-radius:99px;padding:2px 9px;}
  .subtle{color:var(--ink-soft);font-size:12.5px;}
  .tiny-note{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
  .divider{border:none;border-top:1px solid var(--line);margin:16px 0;}

  /* ---- KPI stat card ---- */
  .stat-card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:14px 14px 12px;box-shadow:var(--shadow-sm);}
  .stat-card .stat-value{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:-.01em;}
  .stat-card .stat-label{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}

  /* ---- Forms ---- */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em;}
  .field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;background:var(--surface-2);color:var(--ink);transition:border-color .15s ease,background .15s ease;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);background:#fff;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* ---- Toggle switch (feature/module on-off) ---- */
  .toggle-switch{position:relative;display:inline-flex;align-items:center;width:42px;height:24px;flex-shrink:0;cursor:pointer;}
  .toggle-switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2;}
  .toggle-slider{position:absolute;inset:0;background:var(--slate-tint);border:1px solid var(--line);border-radius:99px;transition:background .18s ease,border-color .18s ease;}
  .toggle-slider::before{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(20,23,35,.25);transition:transform .18s ease;}
  .toggle-switch input:checked + .toggle-slider{background:var(--teal);border-color:var(--teal-dark);}
  .toggle-switch input:checked + .toggle-slider::before{transform:translateX(18px);}
  .toggle-switch input:focus-visible + .toggle-slider{outline:2px solid var(--accent);outline-offset:2px;}
  .toggle-switch input:disabled + .toggle-slider{opacity:.5;cursor:not-allowed;}
  .toggle-row{display:flex;align-items:center;gap:9px;}
  .toggle-state{font-size:12.5px;color:var(--ink-soft);font-weight:700;min-width:54px;text-align:right;}

  /* ---- Buttons ---- */
  .btn{border:none;border-radius:var(--radius-sm);padding:11px 16px;font-size:13.5px;font-weight:700;cursor:pointer;transition:filter .15s ease,background .15s ease,transform .08s ease;}
  .btn:active{filter:brightness(0.94);transform:scale(.98);}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px -8px rgba(52,87,213,.55);}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:var(--slate-tint);color:var(--navy-2);}
  .btn-ghost:hover{background:#E3E6EE;}
  .btn-danger{background:var(--red-tint);color:var(--red-dark);}
  .btn-danger:hover{background:#F9DBD9;}
  .btn-sm{padding:8px 12px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .row{display:flex;gap:8px;align-items:center;}

  /* =========================================================
     LIST ITEMS AS CARDS — every row in every list (schools,
     admins, payments, changelog, etc.) is its own tappable
     card: padded, rounded, shadowed, with a chevron affordance
     when it opens something. No bare border-bottom rows.
     ========================================================= */
  .school-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 14px;margin-bottom:9px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);transition:background .12s ease,border-color .12s ease,transform .08s ease;}
  .school-row:last-child{margin-bottom:0;}
  .school-name{font-weight:700;color:var(--navy);font-size:14px;}
  .clickable{cursor:pointer;}
  .clickable:hover{border-color:var(--line);background:#fff;box-shadow:var(--shadow-sm);}
  .clickable:active{transform:scale(.99);}
  .school-row.clickable::after{content:"";width:8px;height:8px;border-top:2px solid var(--slate);border-right:2px solid var(--slate);transform:rotate(45deg);flex-shrink:0;margin-left:2px;}

  .admin-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:13px 14px;margin-bottom:9px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);}
  .admin-row:last-child{margin-bottom:0;}
  .inline-form{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-top:8px;}
  .empty{color:var(--ink-soft);font-size:13px;padding:16px 4px;text-align:center;background:var(--surface-2);border-radius:var(--radius-sm);border:1px dashed var(--line);}

  /* ---- Badges ---- */
  .badge{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  .badge-active{background:var(--teal-tint);color:var(--teal-dark);}
  .badge-suspended{background:var(--red-tint);color:var(--red-dark);}
  .badge-pending{background:var(--amber-tint);color:var(--amber);}
  .badge-deactivated{background:var(--slate-tint);color:var(--slate);}
  .badge-warn{background:var(--amber-tint);color:var(--amber);}
  .badge-lock{background:var(--navy-2);color:#fff;display:inline-flex;align-items:center;gap:4px;}
  .badge-lock svg{width:10px;height:10px;stroke:#fff;stroke-width:2.4;}

  /* ---- Tables — kept for genuinely tabular data (logs), wrapped as a card panel ---- */
  .table-scroll{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;margin:0;border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:var(--surface-2);}
  .mini-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .mini-table th{text-align:left;color:var(--ink-soft);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;background:var(--surface-2);position:sticky;top:0;}
  .mini-table td{padding:10px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
  .mini-table tr:last-child td{border-bottom:none;}
  .mini-table tbody tr:nth-child(even){background:rgba(20,23,35,.015);}
  .table-scroll .mini-table{min-width:480px;}
  .table-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;}

  /* ---- Nav / status links ---- */
  .back-link{color:var(--accent-dark);font-weight:700;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:4px;margin-bottom:12px;}
  .link-btn{color:var(--accent-dark);font-weight:700;cursor:pointer;}

  /* ---- Messages ---- */
  .err{background:var(--red-tint);color:var(--red-dark);padding:11px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:12px;}
  .msg-ok{background:var(--teal-tint);color:var(--teal-dark);padding:11px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:12px;}


  /* ---- Misc ---- */
  details summary{cursor:pointer;font-weight:700;color:var(--navy-2);font-size:13px;padding:4px 0;}
  pre{background:var(--navy);color:#D7DCEA;border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px;font-size:11px;overflow-x:auto;white-space:pre-wrap;}
  hr.divider{border-top:1px solid var(--line);}

  /* ---- Floating, draggable "Register school" button ---- */
  .fab-drag{
    position:fixed; right:20px; bottom:calc(92px + env(safe-area-inset-bottom,0px)); width:56px; height:56px; border-radius:50%;
    background:linear-gradient(155deg,var(--accent),var(--accent-dark)); color:#fff; border:none; z-index:120;
    display:flex; align-items:center; justify-content:center; cursor:grab;
    box-shadow:0 14px 30px -10px rgba(52,87,213,.55); touch-action:none;
  }
  .fab-drag svg{width:24px;height:24px;pointer-events:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .fab-drag:hover{filter:brightness(1.05);}
  .fab-drag.dragging{cursor:grabbing;box-shadow:0 18px 36px -10px rgba(20,23,35,.45);}

  /* ---- Modal ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,17,26,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;}
  .modal-box{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:22px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-close{background:var(--slate-tint);border:none;border-radius:50%;width:28px;height:28px;color:var(--navy-2);font-size:16px;font-weight:700;cursor:pointer;line-height:1;}

  /* ---- Login ---- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;}
  .login-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line-soft);border-radius:28px;padding:32px 27px 26px;box-shadow:var(--shadow-md);}
  .login-logo{display:block;width:104px;height:104px;border-radius:50%;object-fit:cover;margin:0 auto 16px;box-shadow:0 8px 22px -8px rgba(20,23,35,.35);}
  .login-brand{font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--navy);text-align:center;margin-bottom:26px;}
  .login-brand span{color:var(--accent);}
  .login-card .field input{padding:15px 16px;border-radius:16px;}
  .login-remember{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;color:var(--ink-soft);margin:6px 0 18px;padding-left:4px;cursor:pointer;}
  .login-remember input{width:20px;height:20px;margin:0;accent-color:var(--accent);}
  .login-card .btn-primary{padding:16px;border-radius:99px;font-size:16px;font-weight:800;}
</style>
</head>
<body>
<div id="app"></div>
<div id="fabRoot"></div>
<button id="pwaInstallBtn" title="Install App" style="display:none;position:fixed;right:18px;bottom:18px;z-index:999;width:52px;height:52px;border-radius:50%;background:#3457D5;color:#fff;border:none;box-shadow:0 6px 18px rgba(52,87,213,.35);align-items:center;justify-content:center;cursor:pointer;">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
</button>
<script>
// ===== AUTH =====
// Login only (no sign-up). Credentials are checked by the mother_sign_in database function; the app only

async function sb(path, opts = {}) {
  const headers = Object.assign({
    "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json",
  }, opts.headers || {});
  let res;
  try { res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, { headers })); }
  catch (e) { throw new Error("Check your internet connection and try again."); }
  let data = null;
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) {
    const msg = (data && (data.message || data.error_description)) || "Request failed";

    throw new Error(msg);
  }
  return data;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const ms = new Date(dateStr + "T00:00:00") - new Date(new Date().toDateString());
  return Math.round(ms / 86400000);
}
function subscriptionBadge(s) {
  if (!s.subscription_expires_at) return `<span class="badge badge-deactivated">No plan set</span>`;
  const d = daysUntil(s.subscription_expires_at);
  if (d < 0) return `<span class="badge badge-suspended">Expired ${Math.abs(d)}d ago</span>`;
  if (d <= 7) return `<span class="badge badge-warn">Expires in ${d}d</span>`;
  if (d <= 30) return `<span class="badge badge-warn">Expires in ${d}d</span>`;
  return `<span class="badge badge-active">Active until ${s.subscription_expires_at}</span>`;
}
function statusBadge(status) {
  const map = { pending:"badge-pending", active:"badge-active", suspended:"badge-suspended", deactivated:"badge-deactivated" };
  return `<span class="badge ${map[status]||'badge-deactivated'}">${status}</span>`;
}

function forgetMother() { try { localStorage.removeItem(REMEMBER_KEY); sessionStorage.removeItem(REMEMBER_KEY); } catch(e) {} }
function getRememberedMother() { try { return localStorage.getItem(REMEMBER_KEY) || sessionStorage.getItem(REMEMBER_KEY) || null; } catch(e) { return null; } }
const TOKEN_KEY = "transappleMotherToken";
function forgetToken() { try { localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); } catch(e) {} }
function getRememberedToken() { try { return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || null; } catch(e) { return null; } }

async function tryRestoreMotherSession() {
  const username = getRememberedMother();
  const token = getRememberedToken();
  if (!username || !token) return false;
  try {
    const rows = await sb(`/rest/v1/rpc/restore_mother_session`, { method:"POST", body: JSON.stringify({ p_username: username, p_token: token }) });
    const row = Array.isArray(rows) ? rows[0] : rows;
    if (!row || !row.id) { forgetMother(); forgetToken(); return false; }   // expired or revoked: sign in again
    motherAdmin = Object.assign({}, row, { session_token: token });
    return true;
  } catch(e) { return false; }                                               // offline: keep the saved session, show login
}
function storeSession(username, token, remember) {
  forgetMother(); forgetToken();
  try {
    const st = remember ? localStorage : sessionStorage;
    st.setItem(REMEMBER_KEY, username); st.setItem(TOKEN_KEY, token);
  } catch(e) {}
}

function navTabs(active) {

  return `<div class="tabrail">
    ${PRIMARY_TABS.map(([id,label,icon]) => `<button class="tab-pill ${active===id?'is-active':''}" data-tab="${id}"><span class="icon">${ICONS[icon]}</span>${label}</button>`).join("")}

  <div class="more-sheet" id="moreSheet">
    <div class="more-sheet-handle"></div>
    <div class="more-sheet-title">More</div>
    ${MORE_TABS.map(([id,label,icon]) => `
      <div class="more-item" data-more="${id}">
        <span class="icon">${ICONS[icon]}</span>
        <div class="more-item-label">${label}</div>
        <span class="more-item-chevron">›</span>
      </div>`).join("")}
  </div>`;
}
function wireNavTabs() {
  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.onclick = () => { goTo({ view: btn.dataset.tab }); };
  });
  const moreBtn = document.getElementById("moreTabBtn");
  const sheet = document.getElementById("moreSheet");
  const backdrop = document.getElementById("moreBackdrop");
  const openSheet = () => { sheet.classList.add("is-open"); backdrop.classList.add("is-open"); };
  const closeSheet = () => { sheet.classList.remove("is-open"); backdrop.classList.remove("is-open"); };
  if (moreBtn) moreBtn.onclick = openSheet;
  if (backdrop) backdrop.onclick = closeSheet;
  document.querySelectorAll("[data-more]").forEach(item => {
    item.onclick = () => { goTo({ view: item.dataset.more }); };
  });
}

function makeDraggableFab(el, onActivate) {
  if (!el || el.dataset.dragWired) return;
  el.dataset.dragWired = "1";
  const DRAG_THRESHOLD = 6;
  let pointerId = null, moved = false, startX = 0, startY = 0, startRight = 0, startBottom = 0;
  function clamp(right, bottom) {
    const margin = 8;
    const maxRight = Math.max(window.innerWidth - el.offsetWidth - margin, margin);
    const maxBottom = Math.max(window.innerHeight - el.offsetHeight - margin, margin);
    return [Math.min(Math.max(right, margin), maxRight), Math.min(Math.max(bottom, margin), maxBottom)];
  }
  el.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    pointerId = e.pointerId; moved = false;
    startX = e.clientX; startY = e.clientY;
    const rect = el.getBoundingClientRect();
    startRight = window.innerWidth - rect.right;
    startBottom = window.innerHeight - rect.bottom;
    el.setPointerCapture(pointerId);
    el.classList.add("dragging");
  });
  el.addEventListener("pointermove", (e) => {
    if (pointerId === null || e.pointerId !== pointerId) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (!moved && Math.hypot(dx, dy) > DRAG_THRESHOLD) moved = true;
    if (!moved) return;
    const [right, bottom] = clamp(startRight - dx, startBottom - dy);
    el.style.right = right + "px";
    el.style.bottom = bottom + "px";
  });
  function endDrag(e) {
    if (pointerId === null || (e.pointerId !== undefined && e.pointerId !== pointerId)) return;
    try { el.releasePointerCapture(pointerId); } catch (err) { /* ignore */ }
    pointerId = null;
    el.classList.remove("dragging");
  }
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", endDrag);
  el.addEventListener("click", (e) => {
    if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; return; }
    onActivate();
  });
}

async function loadSchools() {
  const listEl = document.getElementById("schoolList");
  const pendingCard = document.getElementById("pendingCard");
  const pendingList = document.getElementById("pendingList");
  refreshTrashBadge();
  try {
    const schools = await listSchools();
    refreshSuspendedBadge(schools);
    if (!schools.length) {
      listEl.innerHTML = `<div class="tiny-note">No schools registered yet.</div>`;
      if (pendingCard) pendingCard.style.display = "none";
      return;
    }

    const pending = schools.filter(s => s.status === "pending");
    if (pendingCard && pendingList) {
      if (pending.length) {
        pendingCard.style.display = "";
        pendingList.innerHTML = pending.map(s => `
          <div class="school-row">
            <div>
              <div class="school-name">${s.name}</div>
              <div class="tiny-note">${[s.motto, s.location].filter(Boolean).join(" · ") || "Self-registered · " + new Date(s.created_at).toLocaleDateString()}</div>
            </div>
            <div class="row">
              <button class="btn btn-primary btn-sm" data-approve="${s.id}">Approve</button>
              <button class="btn btn-danger btn-sm" data-reject="${s.id}">Reject</button>
            </div>
          </div>`).join("");
        pendingList.querySelectorAll("[data-approve]").forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            try { await approveSchool(btn.dataset.approve); loadSchools(); }
            catch(err) { alert(err.message); }
          };
        });
        pendingList.querySelectorAll("[data-reject]").forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            if (!confirm("Reject and delete this school? Its Administrator account and any data already created will be orphaned — do this only for schools you don't want on the platform.")) return;
            try { await deleteSchool(btn.dataset.reject); loadSchools(); }
            catch(err) { alert(err.message); }
          };
        });
      } else { pendingCard.style.display = "none"; }
    }

    const rest = schools.filter(s => s.status !== "pending" && s.status !== "suspended");
    if (!rest.length) { listEl.innerHTML = `<div class="tiny-note">No approved schools yet.</div>`; return; }
    listEl.innerHTML = rest.map(s => {
      const blockedCount = FEATURE_MODULES.filter(m => s.features && s.features[m.id] === false).length;
      return `
      <div class="school-row clickable" data-open="${s.id}">
        <div>
          <div class="school-name">${s.name}</div>
          <div class="tiny-note">${[s.motto, s.location, s.size_range].filter(Boolean).join(" · ") || new Date(s.created_at).toLocaleDateString()}</div>
          ${s.school_code ? `<div class="tiny-note">School ID: <span class="mono">${s.school_code}</span></div>` : ""}
        </div>
        <div class="row" style="flex-wrap:wrap;justify-content:flex-end;gap:6px;">
          ${statusBadge(s.status)}
          ${s.status==='active' ? subscriptionBadge(s) : ""}
          ${blockedCount > 0 ? `<span class="badge badge-lock">${ICONS.lock}${blockedCount} blocked</span>` : ""}
        </div>
      </div>`;
    }).join("");
    listEl.querySelectorAll("[data-open]").forEach(row => {
      row.onclick = () => { goTo({ currentSchoolId: row.dataset.open, schoolSubTab: null, view: "schoolDetail" }); };
    });
  } catch(e) {
    listEl.innerHTML = `<div class="err">${e.message}</div>`;
  }

function renderSchoolDangerTab(s) {
  const mount = document.getElementById("schoolTabContent");
  const notice = schoolDangerNotice;
  schoolDangerNotice = null;
  const inTrash = !!s.deleted_at;
  const daysLeft = inTrash ? Math.max(0, 90 - Math.floor((Date.now() - new Date(s.deleted_at).getTime()) / 86400000)) : null;
  mount.innerHTML = `
    ${inTrash ? `
    <div class="card" id="trashZoneCard">
      <div class="section-title">In Trash</div>
      <div class="tiny-note" style="margin-bottom:10px;">${daysLeft > 0 ? `Staff can't log in while this school is in Trash. ${daysLeft} day${daysLeft === 1 ? "" : "s"} left before it's purged for good — or restore or permanently delete it anytime before then.` : "Its 3-month recovery window has expired — it will be purged automatically soon."}</div>
      <div id="trashZoneMsg"></div>
      <div class="row" style="flex-wrap:wrap;gap:8px;">
        ${daysLeft > 0 ? `<button class="btn btn-primary btn-sm" id="restoreSchoolBtn">Restore from Trash</button>` : ""}
        <button class="btn btn-ghost btn-sm" id="trashDeleteNowBtn">Delete permanently</button>
      </div>
    </div>` : `
    <div class="card">
      <div class="section-title">Trash</div>
      
      ${notice ? `<div class="msg-ok" style="margin-bottom:10px;">${notice}</div>` : ""}
      <div id="trashZoneMsg"></div>
      <button class="btn btn-primary btn-sm" id="moveToTrashBtn">Move to Trash</button>
    </div>`}
    <div class="card card-danger" id="dangerZoneCard">
      <div class="section-title" style="color:var(--red-dark);">Danger zone</div>
      <div class="tiny-note" style="margin-bottom:10px;">These actions permanently delete data. There is no undo — unlike Trash above. Type the school's exact name below to unlock either button.</div>
      <div id="dangerMsg"></div>
      <div class="field"><label>Type "${s.name}" to confirm</label><input id="dangerConfirmName" /></div>
      <div class="field"><label>Your password</label><input id="dangerConfirmPw" type="password" /></div>
      <div class="row" style="flex-wrap:wrap;gap:8px;">
        <button class="btn btn-ghost btn-sm" id="clearDataBtn" disabled>Clear all data (keep the school &amp; its subscription)</button>
        <button class="btn btn-danger btn-sm" id="deleteAllBtn" disabled>Delete school completely (data + record)</button>
      </div>
    </div>`;

  const trashMsg = document.getElementById("trashZoneMsg");
  const moveToTrashBtn = document.getElementById("moveToTrashBtn");
  if (moveToTrashBtn) moveToTrashBtn.onclick = async () => {
    if (!confirm(`Move "${s.name}" to Trash? Its staff won't be able to log in until it's restored, but no data is deleted. You can restore it for 3 months.`)) return;
    try { await softDeleteSchool(s.id); renderSchoolDetail(); }
    catch(e) { trashMsg.innerHTML = `<div class="err">${e.message}</div>`; }
  };
  const restoreSchoolBtn = document.getElementById("restoreSchoolBtn");
  if (restoreSchoolBtn) restoreSchoolBtn.onclick = async () => {
    try { await restoreSchool(s.id); renderSchoolDetail(); }
    catch(e) { trashMsg.innerHTML = `<div class="err">${e.message}</div>`; }
  };
  const trashDeleteNowBtn = document.getElementById("trashDeleteNowBtn");
  if (trashDeleteNowBtn) trashDeleteNowBtn.onclick = () => {
    const dangerCard = document.getElementById("dangerZoneCard");
    if (dangerCard) dangerCard.scrollIntoView({ behavior: "smooth", block: "start" });
    const nameInput = document.getElementById("dangerConfirmName");
    if (nameInput) nameInput.focus();
  };

  const dzName = document.getElementById("dangerConfirmName");
  const dzPw = document.getElementById("dangerConfirmPw");
  const clearBtn = document.getElementById("clearDataBtn");
  const deleteBtn = document.getElementById("deleteAllBtn");
  const dzUpdateState = () => {
    const match = dzName.value.trim().toLowerCase() === (s.name || "").trim().toLowerCase();
    clearBtn.disabled = !match; deleteBtn.disabled = !match;
  };
  dzName.oninput = dzUpdateState;
  clearBtn.onclick = async () => {
    const msg = document.getElementById("dangerMsg"); msg.innerHTML = "";
    if (!confirm(`Permanently delete every data row for "${s.name}" (students, staff, fees, exams, attendance, comms — everything)? The school's account, plan and features stay. This cannot be undone.`)) return;
    try {
      await purgeSchoolData(s.id, dzPw.value);
      msg.innerHTML = `<div class="msg-ok">All data for "${s.name}" has been permanently deleted. The school account itself is untouched.</div>`;
      dzName.value = ""; dzPw.value = ""; dzUpdateState();
    } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
  };
  deleteBtn.onclick = async () => {
    const msg = document.getElementById("dangerMsg"); msg.innerHTML = "";
    if (!confirm(`Permanently delete "${s.name}" AND every data row belonging to it? The school will disappear from this app completely. This cannot be undone.`)) return;
    try {
      await deleteSchoolCompletely(s.id, dzPw.value);
      goTo({ view: "dashboard", currentSchoolId: null, schoolSubTab: null }, { replace: true });
      return;
    } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
  };
}

async function loadAdmins(schoolId) {
  const listEl = document.getElementById("adminList");
  const grantSelect = document.getElementById("grantSelect");
  try {
    const admins = await listAdmins(schoolId);
    if (!admins.length) {
      listEl.innerHTML = `<div class="empty">No administrator accounts found for this school.</div>`;
    } else {
      const adminAvatarHtml = (a) => {
        if (a.photo_url) return `<img src="${a.photo_url}" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;" />`;
        const initials = (a.full_name || "?").trim().split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase();
        return `<div style="width:36px;height:36px;border-radius:50%;background:var(--card-alt,#eee);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;">${initials}</div>`;
      };
      listEl.innerHTML = admins.map(a => `
        <div class="admin-row">
          <div class="row" style="gap:10px;align-items:center;">
            ${adminAvatarHtml(a)}
            <div>
              <div style="font-weight:700;">${a.full_name}</div>
              <div class="tiny-note">@${a.username}${[a.phone,a.email,a.whatsapp].filter(Boolean).length ? " · " + [a.phone,a.email].filter(Boolean).join(" · ") : ""}</div>
            </div>
          </div>
          <div class="row" style="flex-wrap:wrap;justify-content:flex-end;">
            <button class="btn btn-ghost btn-sm" data-reset="${a.id}" data-email="${a.email||''}" ${a.email ? '' : 'disabled title="No email on file"'}>Send password reset email</button>
            <button class="btn btn-danger btn-sm" data-revoke="${a.id}" ${admins.length<=1?'disabled title="Grant another admin first"':''}>Revoke</button>
          </div>
        </div>`).join("");
      listEl.querySelectorAll("[data-reset]").forEach(btn => {
        btn.onclick = async () => {
          if (btn.disabled) return;
          const msg = document.getElementById("adminMsg"); msg.innerHTML = "";
          const original = btn.textContent;
          btn.disabled = true; btn.textContent = "Sending…";
          try {
            await sendAdminPasswordReset(schoolId, btn.dataset.reset, btn.dataset.email);
            msg.innerHTML = `<div class="msg-ok">Password reset email sent to ${btn.dataset.email}.</div>`;
          } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
          finally { btn.disabled = false; btn.textContent = original; }
        };
      });
      listEl.querySelectorAll("[data-revoke]").forEach(btn => {
        btn.onclick = async () => {
          if (btn.disabled) return;
          if (!confirm("Revoke this account's administrator privileges?")) return;
          const msg = document.getElementById("adminMsg"); msg.innerHTML = "";
          try {
            await setAdminPrivilege(schoolId, btn.dataset.revoke, false);
            msg.innerHTML = `<div class="msg-ok">Admin privileges revoked.</div>`;
            loadAdmins(schoolId);
          } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
        };
      });
    }
    const staff = await listNonAdminStaff(schoolId);
    if (!staff.length) { grantSelect.innerHTML = `<option value="">No other staff accounts</option>`; grantSelect.disabled = true; }
    else {
      grantSelect.disabled = false;
      grantSelect.innerHTML = `<option value="">Select a staff member…</option>` + staff.map(p => `<option value="${p.id}">${p.full_name} (@${p.username})</option>`).join("");
    }
    document.getElementById("grantBtn").onclick = async () => {
      const id = grantSelect.value;
      const msg = document.getElementById("adminMsg"); msg.innerHTML = "";
      if (!id) { msg.innerHTML = `<div class="err">Select a staff member first.</div>`; return; }
      try {
        await setAdminPrivilege(schoolId, id, true);
        msg.innerHTML = `<div class="msg-ok">Admin privileges granted.</div>`;
        loadAdmins(schoolId);
      } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
    };
  } catch(e) {
    listEl.innerHTML = `<div class="err">${e.message}</div>`;
  }
}

function formatDuration(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${sec}s`;
  return `${sec}s`;
}
function timeAgo(dateStr) {
  const s = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
  if (s < 60) return `${Math.max(s,0)}s ago`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  return `${Math.floor(m / 60)}h ago`;
}

        </div>
        <div style="font-weight:800;color:var(--navy);white-space:nowrap;">${formatDuration(v.seconds_spent)}</div>
      </div>`;
    }).join("");
  } catch(e) { listEl.innerHTML = `<div class="err">${e.message}</div>`; }
}

const WEB_TABS = [["website","Website","globe"],["students","Digital Students","admins"]];
const DS_TABS = [["registry","Registry","admins"],["reviews","Reviews","monitoring"],["corrections","Corrections","updates"],["recovery","Recovery","admins"]];

  full_name:"Full name", first_name:"First name", second_name:"Second name", other_name:"Other name",
  date_of_birth:"Date of birth", gender:"Gender", village:"Village", sub_county:"Sub-county", district:"District",

async function mrpc(fn, args) {
  if (!motherAdmin) throw new Error("Please sign in.");
  return sb(`/rest/v1/rpc/${fn}`, { method:"POST", body: JSON.stringify(Object.assign({
    p_username: motherAdmin.username, p_token: motherAdmin.session_token,
  }, args || {})) });
}
function dsDate(d) {
  if (!d) return "—";
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d)); // date-only values: keep the calendar day, no timezone shift
  const x = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date(d);
  return isNaN(x) ? escapeHtml(d) : x.toLocaleDateString();
}
function dsDateTime(d) { if (!d) return "—"; const x = new Date(d); return isNaN(x) ? escapeHtml(d) : x.toLocaleString(); }
function dsVal(v) { return (v == null || v === "") ? "—" : escapeHtml(v); }
function dsInitials(name) {
  return (String(name || "").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("") || "?").toUpperCase();
}
function dsAvatarHtml(name, photoUrl, size) {
  const px = size || 44;
  if (photoUrl) return `<img src="${escapeHtml(photoUrl)}" alt="" style="width:${px}px;height:${px}px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--surface-2);" />`;
  return `<span style="width:${px}px;height:${px}px;border-radius:50%;background:linear-gradient(155deg,var(--accent),var(--accent-dark));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:${Math.round(px*0.38)}px;">${escapeHtml(dsInitials(name))}</span>`;
}
function dsLabel(k) { return DS_FIELD_LABELS[k] || k; }
function dsStatusBadge(status) {
  const map = { pending:"badge-pending", approved:"badge-active", linked:"badge-active", new_issued:"badge-active", resolved:"badge-active", rejected:"badge-suspended", revoked:"badge-deactivated", open:"badge-active", closed:"badge-deactivated" };
  const label = { new_issued:"new SIN issued" }[status] || status;
  return `<span class="badge ${map[status] || 'badge-deactivated'}">${escapeHtml(label)}</span>`;
}
async function dsSchools() {
  if (!dsSchoolsCache) {
    const rows = await listSchools();
    dsSchoolsCache = (rows || []).filter(s => !s.status || s.status === "active");
  }
  return dsSchoolsCache;
}
function dsRefreshVisible() {
  if (view !== "webmanager" || webSubTab !== "students") return;
  loadDsOverview();
  if (dsSection === "registry") dsRefreshList();
  else if (dsSection === "reviews") loadDsReviewList();

function dsCloseModal() { const m = document.getElementById("dsModal"); if (m) m.remove(); }
function dsOpenModal(title) {
  dsCloseModal();
  const o = document.createElement("div");

    const countEl = document.getElementById("dsCount");
    if (countEl) countEl.textContent = rows.length;

    listEl.innerHTML = rows.map(r => `
      <div class="admin-row" data-ds-open="${escapeHtml(r.id)}" style="cursor:pointer;">

  const body = dsOpenModal("Issue a new SIN");
  body.innerHTML = `

      <div class="field"><label>Relationship</label><input id="dsiGRel" /></div>
    </div>
    <div class="field"><label>Guardian phone</label><input id="dsiGContact" inputmode="tel" /></div>
    <div class="grid2">
      <div class="field"><label>Village</label><input id="dsiVillage" /></div>

    </div>
    <div class="field"><label>District</label><input id="dsiDistrict" /></div>
    <div class="tiny-note" style="margin:2px 0 12px;">The SIN is assigned automatically from gender and year of birth (for example SB040000AA for a boy born in 2004, SG150000AA for a girl born in 2015) and can never be changed.</div>
    <button class="btn btn-primary" id="dsiSubmit" style="width:100%;">Issue SIN</button>`;
  const msg = body.querySelector("#dsMsg");
  const btn = body.querySelector("#dsiSubmit");
  const val = (id) => { const v = body.querySelector("#" + id).value.trim(); return v || null; };
  const submit = async (force) => {
    msg.innerHTML = "";
    const name = val("dsiName"), dob = val("dsiDob");
    if (!name) { msg.innerHTML = `<div class="err">Enter the student's full name.</div>`; return; }
    if (!dob) { msg.innerHTML = `<div class="err">Enter the date of birth.</div>`; return; }
    if (!val("dsiGender")) { msg.innerHTML = `<div class="err">Choose male or female. Gender is part of the SIN.</div>`; return; }
    if (new Date(dob) > new Date()) { msg.innerHTML = `<div class="err">The date of birth cannot be in the future.</div>`; return; }
    btn.disabled = true;
    try {
      assertFullAccess();
      const r = await mrpc("mother_issue_sin", {
        p_full_name: name, p_date_of_birth: dob, p_gender: val("dsiGender"),
        p_guardian_name: val("dsiGName"), p_guardian_relation: val("dsiGRel"), p_guardian_contact: val("dsiGContact"),
        p_village: val("dsiVillage"), p_sub_county: val("dsiSub"), p_district: val("dsiDistrict"), p_force: !!force,
      });
      if (r.duplicate) {
        msg.innerHTML = `<div class="err">${escapeHtml(r.error)} Existing SIN: <b style="font-family:monospace;">${escapeHtml(r.existing_sin)}</b>.
          <div class="row" style="margin-top:8px;flex-wrap:wrap;">
            <button class="btn btn-ghost btn-sm" id="dsiOpenExisting">Open that record</button>
            <button class="btn btn-danger btn-sm" id="dsiForce">They are a different student — issue anyway</button>
          </div></div>`;
        msg.querySelector("#dsiOpenExisting").onclick = () => openDsStudent(r.existing_id);
        msg.querySelector("#dsiForce").onclick = () => { if (confirm("Issue a second SIN for a student with the same name and date of birth? Only do this if they really are a different person.")) submit(true); };
        btn.disabled = false; return;
      }
      if (!r.success) throw new Error(r.error || "Could not issue the SIN.");
      body.innerHTML = `
        <div class="msg-ok">SIN issued.</div>
        <div style="text-align:center;margin:14px 0;">
          <div class="tiny-note">${escapeHtml(name)}</div>
          <div style="font-family:monospace;font-size:28px;font-weight:800;letter-spacing:2px;color:var(--navy);">${escapeHtml(r.sin)}</div>
        </div>
        <div class="row" style="flex-wrap:wrap;justify-content:center;">
          <button class="btn btn-primary btn-sm" id="dsiOpen">Open record</button>
          <button class="btn btn-ghost btn-sm" id="dsiAnother">Issue another</button>
        </div>`;
      body.querySelector("#dsiOpen").onclick = () => openDsStudent(r.id);
      body.querySelector("#dsiAnother").onclick = () => openDsIssue();
      dsRefreshVisible();
    } catch (e) { msg.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`; btn.disabled = false; }
  };
  btn.onclick = () => submit(false);
}

      btn.disabled = true;
      if (act === "change_sin") { btn.disabled = false; askDsChangeSin(id, i.sin); return; }
      if (act === "edit-enrollment") { btn.disabled = false; askDsEditEnrollment(id, btn.dataset.student, btn.dataset.school); return; }
      try {
        assertFullAccess();
        let notice = "";
        if (act === "grant") {
          const r = await mrpc("mother_grant_school_access", { p_identity: id, p_school: pickSchool() });
          if (!r.success) throw new Error(r.error);
          notice = r.already ? "That school already holds a grant." : "Access granted. The student has been notified.";
        } else if (act === "revoke") {
          if (!confirm(`Remove ${btn.dataset.school}'s access to this record?`)) { btn.disabled = false; return; }
          const r = await mrpc("mother_revoke_school_access", { p_grant_id: btn.dataset.grant });
          if (!r.success) throw new Error(r.error);
          notice = "Access removed.";
        } else if (act === "closewin") {
          const r = await mrpc("mother_close_transfer_window", { p_window: btn.dataset.window });
          if (!r.success) throw new Error(r.error);
          notice = "Transfer window closed.";
        } else if (act === "hard_delete") {
          const nameInput = body.querySelector("#dsHardConfirmName");
          if (!nameInput || nameInput.value.trim().toLowerCase() !== (i.full_name || "").trim().toLowerCase()) throw new Error("Type the student's exact full name to confirm.");
          const pw = body.querySelector("#dsAdminPw").value;
          if (!pw) throw new Error("Enter your admin password to confirm.");
          if (!confirm(`Permanently delete "${i.full_name}" (${i.sin})? The SIN record and everything linked to it — schools history, grants, transfer windows, corrections — will be destroyed for good. This cannot be undone.`)) { btn.disabled = false; return; }
          const reason = body.querySelector("#dsReason").value.trim();
          const r = await mrpc("mother_student_security", { p_password: pw, p_identity: id, p_action: "hard_delete", p_reason: reason || null });
          if (!r.success) throw new Error(r.error || "That did not work.");
          dsSchoolsCache = null;
          dsCloseModal();
          dsRefreshVisible();
          return;
        } else {
          const pw = body.querySelector("#dsAdminPw").value;
          if (!pw) throw new Error("Enter your admin password to confirm.");
          const reason = body.querySelector("#dsReason").value.trim();
          const prompts = {
            reset_password: "Reset this student's password? They will be signed out everywhere.",
            reset_2fa: "Turn off this student's two-step verification? They will be signed out everywhere.",
            suspend: "Suspend this student's portal account? They will be signed out everywhere.",
            sign_out_devices: "Sign this student out of all devices?",
            delete: "Delete this SIN record? It will disappear from the registry and the student's portal will be suspended. This can be undone from here with Restore.",
            restore: "Restore this SIN record back into the registry?",
          };
          if (prompts[act] && !confirm(prompts[act])) { btn.disabled = false; return; }
          const r = await mrpc("mother_student_security", { p_password: pw, p_identity: id, p_action: act, p_reason: reason || null });
          if (!r.success) throw new Error(r.error || "That did not work.");
          const done = { reset_2fa: "2FA turned off. The student can set it up again.", suspend: "Account suspended.", unsuspend: "Account restored.", sign_out_devices: "Signed out of all devices.", delete: "SIN record deleted.", restore: "SIN record restored." };
          if (act === "reset_password") {
            notice = `Password reset.<div style="margin-top:8px;">Temporary password${r.username ? " for <b>" + escapeHtml(r.username) + "</b>" : ""}:</div>
              <div style="font-family:monospace;font-size:20px;font-weight:800;letter-spacing:1px;margin:6px 0;word-break:break-all;">${escapeHtml(r.temp_password)}</div>
              <div class="tiny-note">Shown once — it is not stored. Give it to the student in person; they must choose a new password when they sign in.</div>`;
          } else notice = done[act] || "Done.";
        }
        dsSchoolsCache = null;
        openDsStudent(id, `<div class="msg-ok">${notice}</div>`);
        dsRefreshVisible();
      } catch (e) { msg.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`; btn.disabled = false; }
    };
  });
}

function dsCloseHistModal() { const m = document.getElementById("dsHistModal"); if (m) m.remove(); }
function dsOpenStackedModal(title) {
  dsCloseHistModal();
  const o = document.createElement("div");
  o.className = "modal-overlay"; o.id = "dsHistModal";
  o.innerHTML = `<div class="modal-box" style="max-width:560px;">
    <div class="modal-head"><div class="section-title" style="margin-bottom:0;" id="dsHistModalTitle"></div>

function askDsChangeSin(identityId, currentSin) {
  try { assertFullAccess(); } catch (e) { alert(e.message); return; }
  const body = dsOpenStackedModal("Change student number");
  body.innerHTML = `
    <div class="tiny-note" style="margin-bottom:10px;">Current number: <b style="font-family:monospace;">${escapeHtml(currentSin)}</b>. This changes the student's permanent number everywhere, including how they sign in. Use this only to correct a mistake — the old number can never be reissued.</div>

async function loadDsReviewList() {
  const el = document.getElementById("dsRevList");
  if (!el) return;
  try {
    const rows = await mrpc("mother_list_match_reviews", { p_status: dsReviewFilter === "all" ? null : "pending" });
    if (!document.getElementById("dsRevList")) return;
    const cnt = document.getElementById("dsRevCount"); if (cnt) cnt.textContent = rows.length;
    if (!rows.length) { el.innerHTML = `<div class="card"><div class="empty">${dsReviewFilter === "all" ? "No reviews yet." : "Nothing is waiting for review."}</div></div>`; return; }
    const full = isFullAccess();
    el.innerHTML = rows.map(r => {
      const c = r.candidate || {};
      const fieldsText = (m) => Array.isArray(m.fields) ? m.fields.map(dsLabel).join(", ") : (m.fields && typeof m.fields === "object" ? Object.keys(m.fields).map(dsLabel).join(", ") : "");
      const pending = r.status === "pending";
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">
          <div><div style="font-weight:800;">${escapeHtml(r.ref)}</div><div class="tiny-note">${escapeHtml(r.school_name || "Unknown school")} · ${dsDateTime(r.created_at)}</div></div>
          ${dsStatusBadge(r.status)}
        </div>
        <div class="tiny-note" style="margin:10px 0 4px;font-weight:700;">Being registered</div>
        <div class="admin-row" style="display:block;">
          <div style="font-weight:700;">${dsVal(c.full_name)}</div>
          <div class="tiny-note">Born ${dsDate(c.date_of_birth)}${c.gender ? " · " + escapeHtml(c.gender) : ""}</div>
          <div class="tiny-note">Guardian: ${dsVal(c.guardian_name)}${c.guardian_contact ? " · " + escapeHtml(c.guardian_contact) : ""}</div>
        </div>
        ${(r.matches || []).length ? `<div class="tiny-note" style="margin:10px 0 4px;font-weight:700;">Possible existing students</div>` + r.matches.map(m => `
          <div class="admin-row" style="display:block;">
            <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
              <div><div style="font-weight:700;">${dsVal(m.full_name)}</div>
              <div class="tiny-note"><span style="font-family:monospace;font-weight:700;">${escapeHtml(m.sin)}</span> · born ${dsDate(m.date_of_birth)}${m.gender ? " · " + escapeHtml(m.gender) : ""}</div>
              <div class="tiny-note">Guardian: ${dsVal(m.guardian_name)}</div>
              ${fieldsText(m) ? `<div class="tiny-note">Matched on: ${escapeHtml(fieldsText(m))}</div>` : ""}</div>
              <div style="display:flex;gap:6px;flex-shrink:0;">
                <button class="btn btn-ghost btn-sm" data-rev-act="open" data-identity="${escapeHtml(m.identity_id)}">Open</button>
                ${pending && full ? `<button class="btn btn-primary btn-sm" data-rev-act="link" data-rev="${escapeHtml(r.id)}" data-identity="${escapeHtml(m.identity_id)}" data-name="${escapeHtml(m.full_name)}">Same student</button>` : ""}
              </div>
            </div>
          </div>`).join("") : ""}
        ${pending && full ? `
          <div class="field" style="margin-top:12px;"><label>Note (optional)</label><input id="dsRevNote_${escapeHtml(r.id)}" /></div>
          <div class="row" style="flex-wrap:wrap;">
            <button class="btn btn-ghost btn-sm" data-rev-act="new" data-rev="${escapeHtml(r.id)}">Different student — issue new SIN</button>
            <button class="btn btn-danger btn-sm" data-rev-act="reject" data-rev="${escapeHtml(r.id)}">Reject</button>
          </div>` : ""}
        ${!pending ? `<div class="tiny-note" style="margin-top:10px;">Resolved ${dsDateTime(r.resolved_at)}${r.resolved_by ? " by " + escapeHtml(r.resolved_by) : ""}${r.resolution_notes ? " — " + escapeHtml(r.resolution_notes) : ""}</div>` : ""}
      </div>`;
    }).join("");
    el.querySelectorAll("[data-rev-act]").forEach(btn => {
      btn.onclick = async () => {
        const act = btn.dataset.revAct;
        if (act === "open") { openDsStudent(btn.dataset.identity); return; }
        const msg = document.getElementById("dsRevMsg");
        const rid = btn.dataset.rev;
        const note = (document.getElementById("dsRevNote_" + rid) || { value: "" }).value.trim();
        const asks = {
          link: `Link this registration to ${btn.dataset.name || "that student"}? The school gets access to their existing SIN.`,
          new: "Issue a brand-new SIN for this registration? Only do this if it is not any of the students listed.",
          reject: "Reject this registration? The school will need to correct it and register again.",
        };
        if (!confirm(asks[act])) return;
        btn.disabled = true; msg.innerHTML = "";
        try {
          assertFullAccess();
          const r = await mrpc("mother_resolve_match_review", { p_id: rid, p_action: act, p_identity: act === "link" ? btn.dataset.identity : null, p_notes: note || null });
          if (!r.success) throw new Error(r.error || "That did not work.");
          msg.innerHTML = `<div class="msg-ok">${act === "reject" ? "Registration rejected." : "Done — SIN <b style=\"font-family:monospace;\">" + escapeHtml(r.sin) + "</b> " + (act === "link" ? "linked to the school." : "issued and given to the school.")}</div>`;
          dsRefreshVisible();
        } catch (e) { msg.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`; btn.disabled = false; }
      };
    });
  } catch (e) { el.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`; }
}

async function loadDsCorrectionList() {

    el.innerHTML = rows.map(r => {
      const changes = (r.changes && typeof r.changes === "object") ? r.changes : {};
      const cur = r.current || {};
      const pending = r.status === "pending";
      const changeRows = Object.keys(changes).map(k => {
        const known = Object.prototype.hasOwnProperty.call(DS_FIELD_LABELS, k);
        return `<tr><td>${escapeHtml(dsLabel(k))}${known ? "" : ' <span class="badge badge-suspended">Not correctable</span>'}</td><td>${dsVal(cur[k])}</td><td style="font-weight:700;">${dsVal(changes[k])}</td></tr>`;
      }).join("");
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">
          <div><div style="font-weight:800;">${escapeHtml(r.ref)} · ${dsVal(r.full_name)}</div>
          <div class="tiny-note"><span style="font-family:monospace;font-weight:700;">${escapeHtml(r.sin)}</span> · from the ${escapeHtml(r.submitted_by)}${r.school_name ? " (" + escapeHtml(r.school_name) + ")" : ""} · ${dsDateTime(r.submitted_at)}</div></div>
          ${dsStatusBadge(r.status)}
        </div>
        <button class="btn btn-ghost btn-sm" data-corr-act="open" data-identity="${escapeHtml(r.identity_id)}" style="margin-top:8px;">Open student</button>
        ${r.reason ? `<div class="tiny-note" style="margin-top:8px;">Reason: ${escapeHtml(r.reason)}</div>` : ""}
        <div class="table-scroll" style="margin-top:10px;"><table class="mini-table"><thead><tr><th>Field</th><th>Now</th><th>Proposed</th></tr></thead><tbody>${changeRows || '<tr><td colspan="3">No changes listed.</td></tr>'}</tbody></table></div>
        ${pending && full ? `
          <div class="field" style="margin-top:12px;"><label>Note to the requester (optional)</label><input id="dsCorrNote_${escapeHtml(r.id)}" /></div>
          <div class="row" style="flex-wrap:wrap;">
            <button class="btn btn-primary btn-sm" data-corr-act="approve" data-corr="${escapeHtml(r.id)}" data-ref="${escapeHtml(r.ref)}">Approve</button>
            <button class="btn btn-danger btn-sm" data-corr-act="reject" data-corr="${escapeHtml(r.id)}" data-ref="${escapeHtml(r.ref)}">Reject</button>
          </div>` : ""}
        ${!pending ? `<div class="tiny-note" style="margin-top:10px;">Resolved ${dsDateTime(r.resolved_at)}${r.resolved_by ? " by " + escapeHtml(r.resolved_by) : ""}${r.resolution_notes ? " — " + escapeHtml(r.resolution_notes) : ""}</div>` : ""}
      </div>`;
    }).join("");
    el.querySelectorAll("[data-corr-act]").forEach(btn => {
      btn.onclick = async () => {
        if (btn.dataset.corrAct === "open") { openDsStudent(btn.dataset.identity); return; }
        const msg = document.getElementById("dsCorrMsg");
        const approve = btn.dataset.corrAct === "approve";
        const note = (document.getElementById("dsCorrNote_" + btn.dataset.corr) || { value: "" }).value.trim();
        if (!confirm(approve ? `Approve ${btn.dataset.ref}? The change is applied to the student's record and every school's copy.` : `Reject ${btn.dataset.ref}?`)) return;
        btn.disabled = true; msg.innerHTML = "";
        try {
          assertFullAccess();
          const r = await mrpc("mother_resolve_correction", { p_id: btn.dataset.corr, p_approve: approve, p_notes: note || null });
          if (!r.success) throw new Error(r.error || "That did not work.");
          msg.innerHTML = `<div class="msg-ok">${escapeHtml(btn.dataset.ref)} ${approve ? "approved and applied" : "rejected"}. The student has been notified.</div>`;
          dsRefreshVisible();
        } catch (e) { msg.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`; btn.disabled = false; }
      };
    });
  } catch (e) { el.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`; }
}

let dsRecFilter = "pending";
const DS_REC_KIND = { password: "Reset password", "2fa": "Reset 2FA", both: "Reset password and 2FA" };
function loadDsRecovery() {
  const body = document.getElementById("dsBody");
  body.innerHTML = `
    <div class="card">
      <div class="section-title">Recovery requests<span class="count-chip" id="dsRecCount">0</span></div>
      
      <div class="field" style="margin-bottom:0;"><label>Show</label><select id="dsRecFilter"><option value="pending">Waiting for me</option><option value="all">Everything</option></select></div>
    </div>
    <div id="dsRecMsg"></div>
    <div id="dsRecList" class="tiny-note">Loading…</div>`;
  const f = document.getElementById("dsRecFilter");
  f.value = dsRecFilter;
  f.onchange = () => { dsRecFilter = f.value; loadDsRecoveryList(); };
  loadDsRecoveryList();
}
async function loadDsRecoveryList() {
  const el = document.getElementById("dsRecList");
  if (!el) return;
  try {
    const rows = await mrpc("mother_list_recovery_requests", { p_status: dsRecFilter === "all" ? "all" : "pending" });
    if (!document.getElementById("dsRecList")) return;
    const cnt = document.getElementById("dsRecCount"); if (cnt) cnt.textContent = rows.length;
    if (!rows.length) { el.innerHTML = `<div class="card"><div class="empty">${dsRecFilter === "all" ? "No recovery requests yet." : "No recovery requests are waiting."}</div></div>`; return; }
    const full = isFullAccess();
    el.innerHTML = rows.map(r => {
      const pending = r.status === "pending";
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">
          <div><div style="font-weight:800;">${escapeHtml(r.ref)} · ${escapeHtml(DS_REC_KIND[r.kind] || r.kind)}</div>
          <div class="tiny-note"><span style="font-family:monospace;font-weight:700;">${escapeHtml(r.sin)}</span> · ${dsDateTime(r.created_at)}</div></div>
          ${dsStatusBadge(r.status)}
        </div>
        <div class="table-scroll" style="margin-top:10px;"><table class="mini-table"><thead><tr><th></th><th>On the record</th><th>Typed in the request</th></tr></thead><tbody>
          <tr><td>Name</td><td>${dsVal(r.record_name)}</td><td style="font-weight:700;">${dsVal(r.typed_name)}</td></tr>
          <tr><td>Phone</td><td>${dsVal(r.record_phone)}</td><td style="font-weight:700;">${dsVal(r.typed_phone)}</td></tr>
        </tbody></table></div>
        <div class="tiny-note" style="margin-top:8px;">Portal account: ${r.has_account ? "set up" : "not set up"} · 2FA: ${r.has_2fa ? "on" : "off"}${r.portal_status && r.portal_status !== "active" ? " · " + escapeHtml(r.portal_status) : ""}</div>
        ${r.note ? `<div class="tiny-note" style="margin-top:6px;">Note from student: ${escapeHtml(r.note)}</div>` : ""}
        ${pending ? `
          <div class="row" style="flex-wrap:wrap;margin-top:12px;">
            <button class="btn btn-ghost btn-sm" data-rec-act="open" data-identity="${escapeHtml(r.identity_id)}">Open student</button>
            ${full ? `<button class="btn btn-primary btn-sm" data-rec-act="resolved" data-rec="${escapeHtml(r.id)}" data-ref="${escapeHtml(r.ref)}">Mark handled</button>
            <button class="btn btn-danger btn-sm" data-rec-act="rejected" data-rec="${escapeHtml(r.id)}" data-ref="${escapeHtml(r.ref)}">Decline</button>` : ""}
          </div>` : `<div class="tiny-note" style="margin-top:10px;">Closed ${dsDateTime(r.resolved_at)}${r.resolved_by ? " by " + escapeHtml(r.resolved_by) : ""}${r.resolution_notes ? " — " + escapeHtml(r.resolution_notes) : ""}</div>`}
      </div>`;
    }).join("");
    el.querySelectorAll("[data-rec-act]").forEach(btn => {
      btn.onclick = async () => {
        const act = btn.dataset.recAct;
        if (act === "open") { openDsStudent(btn.dataset.identity); return; }
        const msg = document.getElementById("dsRecMsg");
        const note = prompt(act === "resolved" ? `Note for ${btn.dataset.ref} (optional):` : `Why is ${btn.dataset.ref} declined? (the student is told they could not be verified)`, "");
        if (note === null) return;
        btn.disabled = true; msg.innerHTML = "";
        try {
          assertFullAccess();
          const r = await mrpc("mother_resolve_recovery_request", { p_id: btn.dataset.rec, p_status: act, p_notes: note.trim() || null });
          if (!r.success) throw new Error(r.error || "That did not work.");
          msg.innerHTML = `<div class="msg-ok">${escapeHtml(btn.dataset.ref)} ${act === "resolved" ? "marked handled" : "declined"}. The student has been notified.</div>`;
          dsRefreshVisible();
        } catch (e) { msg.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`; btn.disabled = false; }
      };
    });
  } catch (e) { el.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`; }
}

function render() {
  if (!motherAdmin) { renderLogin(); return; }
  dsCloseModal();
  if (view === "settings") renderSettings();
  else if (view === "suspended") renderSuspendedPage();
  else if (view === "trash") renderTrashPage();
  else if (view === "schoolDetail") renderSchoolDetail();
  else if (view === "analytics") renderAnalytics();
  else if (view === "monitoring") renderMonitoring();
  else if (view === "comms") renderComms();
  else if (view === "updates") renderUpdates();
  else if (view === "security") renderSecurity();
  else if (view === "webmanager") renderWebManager();
  else renderDashboard();
  updateRegisterSchoolFab();
}
document.addEventListener("focusin", (e) => {
  const t = e.target;
  if (t.matches && t.matches("input, select, textarea")) {
    setTimeout(() => {
      t.scrollIntoView({ block: "center", behavior: "smooth" });
    }, 300); // gives the mobile keyboard time to finish animating in
  }
});

boot();
</script>
